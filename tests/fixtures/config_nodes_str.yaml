cluster: { name: str, desc: test }
image: img:test
model: { path: /m/models, served_model_name: glm-52, dir_host: "", mounts: [] }
nodes:
  prefill:
    - "10.0.2.1"   # 字符串形式节点（非 dict）
    - "10.0.2.2"
  decode:
    - "10.0.2.5"
    - "10.0.2.6"
pd_cluster:
  max_model_len: 200000
  num_cards: 8
  prefill: { dp_size: 4, tp_size: 8, dp_size_local: 1, base_port: 9081, kv_port: 30000, rpc_port: 16591 }
  decode:  { dp_size: 8, tp_size: 4, dp_size_local: 2, base_port: 9900, kv_port: 30100, rpc_port: 16600 }
  enable_prefix_caching: true
proxy: { node: p0, port: 1999, script_path: "" }
mooncake: { port: 50088, evict: 0.9 }
container: { name: vllm-ascend, shm_size: 1024g }
runtime: { ready_timeout: 2400 }