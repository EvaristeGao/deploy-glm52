# A3 GLM-5.2 receipt validation. Render with inventories/a3-reuse/inventory.yaml.
# Keep the existing Mooncake master and baseline containers during preparation.
# Use the guarded receipt supervisor to stage the verified source and cut over.
reuse_render_only: true
pd_cluster:
  max_model_len: 16384
  num_cards: 16
  v030_env: true
  pd_connector: layerwise
  hixl_preset: roce
  hixl_presets:
    roce:
      ASCEND_GLOBAL_RESOURCE_CONFIG: '{"comm_resource_config":{"protocol_desc":"roce:device"}}'
  extra_env:
    HCCL_INTRA_ROCE_ENABLE: 1
    HCCL_INTRA_PCIE_ENABLE: 0
    ASCEND_LOCAL_COMM_RES: '{"version":"1.3"}'
    HCCL_BUFFSIZE: 1024
    ACL_OP_INIT_MODE: 1
    PYTHONHASHSEED: 0
    OMP_PROC_BIND: false
    OMP_NUM_THREADS: 10
    GLOG_minloglevel: 2
    # The Mooncake engine configures glog from its own log-level setting.
    MC_LOG_LEVEL: ERROR
  range_debug: false
  layerwise:
    enabled: true
    prefetch_layers: 1
    num_shared_buffers: 2
    independent_layers: [0, -1]
    max_transfer_blocks: 64
    max_transfer_bytes: 16777216
  prefill:
    dp_size: 2
    tp_size: 16
    dp_size_local: 1
    base_port: 9181
    kv_port: 31000
    rpc_port: 17591
    engine_id: 0
    max_num_batched_tokens: 4112
    max_num_seqs: 1
    gpu_memory_utilization: 0.9
    enable_prefix_caching: true
    enable_chunked_prefill: true
    safetensors_prefetch: true
    kv_cache_dtype: auto
    indexer_kv_dtype: int8
    non_master_headless: false
    api_server_count: 1
    enable_mtp: false
    kv_load_failure_policy: fail
    additional_config: >-
      {"multistream_overlap_shared_expert": true, "mega_moe_max_tokens": 524544,
       "enable_flashcomm1": true, "enable_fused_mc2": 1,
       "ascend_compilation_config": {"fuse_muls_add": true}}
  decode:
    dp_size: 2
    tp_size: 16
    dp_size_local: 1
    base_port: 9910
    kv_port: 31200
    rpc_port: 17600
    engine_id: 2
    max_num_batched_tokens: 192
    max_num_seqs: 4
    gpu_memory_utilization: 0.92
    enable_prefix_caching: false
    enforce_eager: true
    async_scheduling: true
    safetensors_prefetch: true
    kv_cache_dtype: auto
    indexer_kv_dtype: int8
    non_master_headless: false
    api_server_count: 1
    enable_mtp: false
    additional_config: >-
      {"multistream_overlap_shared_expert": true, "enable_fused_mc2": 1, "enable_mlapo": true,
       "scheduler_config": {"recompute_scheduler_enable": false},
       "ascend_compilation_config": {"fuse_muls_add": true},
       "sparse_kv_offload_config": {"enabled": true, "host_backend": "mooncake",
                                    "use_fused_overlap": true, "keep_device_kv_cache": false}}
    receipt_connector_extra:
      layerwise_receipt_mode: true
      target_owner_rpc_base_port: 33100
      target_retention_rpc_port: 33120
    enable_log_requests: true
runtime:
  ready_timeout: 2400
  proxy_ready_timeout: 600
proxy:
  port: 8100
  layerwise: true
  script: load_balance_proxy_layerwise_server_example.py
  layerwise_image_dir: /vllm-workspace/vllm-ascend/examples/disaggregated_prefill_v1
  prefill_nodes: []
  decode_nodes: []
mooncake:
  enabled: true
  image: glm52-vllm-ascend:0.30.0-rx-b5
  evict: 0.9
  global_segment_size: 40GB
  default_kv_lease_ttl: 300000
  prefer_alloc_in_same_node: true
  preferred_segment: true
  ha:
    enable_ha: false
    rpc_port: 52150
    metrics_port: 52152
    eviction_ratio: 0.2
    log_dir: /var/log/mooncake_master
container:
  name: vllm-ascend-glm52-receipt
  shm_size: 1024g
logs:
  dir: /mnt/sfs_turbo/g00832294/logs/receipt
  vllm: vllm_{node}.log
  mooncake: mooncake_{node}.log
  proxy: proxy.log
gen_dir: '{{ playbook_dir }}/../../artifacts/p-main-buffer-reuse/receipt-profile-render'
