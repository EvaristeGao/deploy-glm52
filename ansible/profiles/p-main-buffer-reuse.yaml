# Verified Main-only Prefill reuse; gen.yml only.
# Use the guarded container tool to retain the captured baseline containers.
# Eager, MTP disabled, single manager group; automatic Prefill block budget.
reuse_render_only: true
pd_cluster:
  max_model_len: 262144
  num_cards: 16
  hixl_preset: roce
  hixl_presets:
    roce:
      ASCEND_GLOBAL_RESOURCE_CONFIG: '{"comm_resource_config":{"protocol_desc":"roce:device"}}'
    ubmem:
      ASCEND_GLOBAL_RESOURCE_CONFIG: '{"comm_resource_config":{"protocol_desc":"ubmem"}}'
  extra_env:
    HCCL_INTRA_ROCE_ENABLE: 1
    HCCL_INTRA_PCIE_ENABLE: 0
    ASCEND_LOCAL_COMM_RES: '{"version":"1.3"}'
    HCCL_BUFFSIZE: 1024
    ACL_OP_INIT_MODE: 1
    PYTHONHASHSEED: 0
    OMP_PROC_BIND: false
    OMP_NUM_THREADS: 10
  v030_env: true
  pd_connector: layerwise
  layerwise:
    enabled: true
    prefetch_layers: 1
    num_shared_buffers: 2
    independent_layers:
    - 0
    - -1
    max_transfer_blocks: 64
    max_transfer_bytes: 16777216
  prefill:
    dp_size: 2
    tp_size: 16
    dp_size_local: 1
    base_port: 9081
    kv_port: 30000
    rpc_port: 16591
    engine_id: 0
    max_num_batched_tokens: 4112
    max_num_seqs: 4
    gpu_memory_utilization: 0.9
    enable_prefix_caching: true
    enable_chunked_prefill: true
    safetensors_prefetch: true
    kv_cache_dtype: int8
    indexer_kv_dtype: int8
    non_master_headless: false
    api_server_count: 1
    additional_config: '{"multistream_overlap_shared_expert": true, "mega_moe_max_tokens":
      8192, "enable_flashcomm1": true, "enable_fused_mc2": 1, "ascend_compilation_config":
      {"fuse_muls_add": true}}'
    enable_mtp: false
    kv_load_failure_policy: fail
  decode:
    dp_size: 2
    tp_size: 16
    dp_size_local: 1
    base_port: 9900
    kv_port: 30200
    rpc_port: 16600
    engine_id: 2
    max_num_batched_tokens: 192
    max_num_seqs: 4
    gpu_memory_utilization: 0.92
    num_speculative_tokens: 5
    hccl_buffsize: 400
    enable_prefix_caching: false
    enforce_eager: true
    async_scheduling: false
    safetensors_prefetch: true
    kv_cache_dtype: int8
    indexer_kv_dtype: int8
    non_master_headless: false
    api_server_count: 1
    additional_config: '{"multistream_overlap_shared_expert": true, "enable_fused_mc2":
      1, "enable_mlapo": true, "scheduler_config": {"recompute_scheduler_enable":
      true}, "ascend_compilation_config": {"fuse_muls_add": true}}'
    enable_mtp: false
    num_gpu_blocks_override: 5508
model_path: /root/reuse-main-20261103-model
gen_dir: '{{ playbook_dir }}/../../artifacts/p-main-buffer-reuse/generated-r03'
image: glm52-vllm-ascend:0.30.0-main-reuse-dev-20261103-r03
container:
  name: vllm-ascend-gwh-glm52-reuse-r03
  shm_size: 1024g
