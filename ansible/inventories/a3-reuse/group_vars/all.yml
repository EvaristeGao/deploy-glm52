# A3 receipt P/D with Prefill Main reuse and Decode Host offload.
# Operational instructions and validation limits: ../usage.md.
ansible_user: root
ansible_python_interpreter: /usr/bin/python3
ansible_ssh_retries: 3
ansible_ssh_common_args: >-
  -o BatchMode=yes -o StrictHostKeyChecking=accept-new
  -o ConnectTimeout=10 -o ConnectionAttempts=3
  -o ServerAliveInterval=30 -o ServerAliveCountMax=3
  -o ControlMaster=no -o ControlPath=none
  {{ '' if inventory_hostname == 'p0' else
     "-o ProxyCommand='ssh -o BatchMode=yes -o ControlMaster=no -o ControlPath=none -W %h:%p root@ott9-a31'" }}

cluster_type: a3
# The local image contains the full receipt package and proxy at c76f087d2.
engine_images:
  prefill: glm52-vllm-ascend:0.30.0-receipt-c76f087d2
  decode: glm52-vllm-ascend:0.30.0-receipt-c76f087d2
image: "{{ engine_images.decode if inventory_hostname in groups['decode'] else engine_images.prefill }}"
image_tar: /mnt/sfs_turbo/g00832294/build/images/0.30.0-receipt-c76f087d2.tar

model_path: /mnt/sfs_turbo/models/GLM-5.2-w4a8c8
model_name: glm-52
model:
  path: "{{ model_path }}"
  served_model_name: "{{ model_name }}"
  dir_host: ""
  mounts:
    - /mnt/sfs_turbo:/mnt/sfs_turbo

pd_cluster:
  # Keep the context and capacity from the matched 64K receipt run.
  max_model_len: 65536
  num_cards: 16
  v030_env: true
  pd_connector: layerwise
  hixl_preset: roce
  hixl_presets:
    roce:
      ASCEND_GLOBAL_RESOURCE_CONFIG: '{"comm_resource_config":{"protocol_desc":"roce:device"}}'
  extra_env:
    HCCL_INTRA_ROCE_ENABLE: 1
    HCCL_INTRA_PCIE_ENABLE: 0
    ASCEND_LOCAL_COMM_RES: '{"version":"1.3"}'
    HCCL_BUFFSIZE: 1024
    ACL_OP_INIT_MODE: 1
    PYTHONHASHSEED: 0
    OMP_PROC_BIND: false
    OMP_NUM_THREADS: 10
    GLOG_minloglevel: 2
    MC_LOG_LEVEL: ERROR
  range_debug: false
  layerwise:
    enabled: true
    prefetch_layers: 1
    num_shared_buffers: 2
    independent_layers: [0, -1]
    max_transfer_blocks: 64
    max_transfer_bytes: 16777216
  prefill:
    dp_size: 2
    tp_size: 16
    dp_size_local: 1
    base_port: 9081
    kv_port: 30000
    rpc_port: 16591
    engine_id: 0
    max_num_batched_tokens: 32784
    max_num_seqs: 1
    gpu_memory_utilization: 0.9
    enable_prefix_caching: true
    enable_chunked_prefill: true
    safetensors_prefetch: true
    num_gpu_blocks_override: 513
    kv_cache_dtype: auto
    indexer_kv_dtype: int8
    non_master_headless: false
    api_server_count: 1
    enable_mtp: false
    kv_load_failure_policy: fail
    additional_config: >-
      {"multistream_overlap_shared_expert": true, "mega_moe_max_tokens": 524544,
       "enable_flashcomm1": true, "enable_fused_mc2": 1,
       "ascend_compilation_config": {"fuse_muls_add": true}}
  decode:
    dp_size: 2
    tp_size: 16
    dp_size_local: 1
    base_port: 9900
    kv_port: 30200
    rpc_port: 16600
    engine_id: 2
    max_num_batched_tokens: 192
    max_num_seqs: 1
    gpu_memory_utilization: 0.92
    num_gpu_blocks_override: 513
    enable_prefix_caching: false
    enforce_eager: true
    async_scheduling: true
    safetensors_prefetch: true
    kv_cache_dtype: auto
    indexer_kv_dtype: int8
    non_master_headless: false
    api_server_count: 1
    enable_mtp: false
    additional_config: >-
      {"multistream_overlap_shared_expert": true, "enable_fused_mc2": 1,
       "enable_mlapo": true, "scheduler_config": {"recompute_scheduler_enable": false},
       "ascend_compilation_config": {"fuse_muls_add": true},
       "sparse_kv_offload_config": {"enabled": true, "host_backend": "mooncake",
                                    "use_fused_overlap": true, "keep_device_kv_cache": false}}
    receipt_connector_extra:
      layerwise_receipt_mode: true
      target_owner_rpc_base_port: 33100
      target_retention_rpc_port: 33120

runtime:
  ready_timeout: 2400
  proxy_ready_timeout: 600
proxy:
  port: 8000
  layerwise: true
  script: load_balance_proxy_layerwise_server_example.py
  layerwise_image_dir: /vllm-workspace/vllm-ascend/examples/disaggregated_prefill_v1
  prefill_nodes: []
  decode_nodes: []

mooncake:
  enabled: true
  image: glm52-vllm-ascend:0.30.0-rx-b5
  container_name: mooncake-a3-reuse-receipt-p0
  evict: 0.9
  global_segment_size: 40GB
  default_kv_lease_ttl: 300000
  prefer_alloc_in_same_node: true
  preferred_segment: true
  ha:
    enable_ha: false
    rpc_port: 52210
    metrics_port: 52212
    eviction_ratio: 0.2
    log_dir: /var/log/mooncake_master

# Distinct names retain the previous deployment for rollback during cutover.
container:
  name: vllm-ascend-glm52-a3-reuse-receipt
  shm_size: 1024g
logs:
  dir: /mnt/sfs_turbo/g00832294/logs/a3-reuse-receipt-c76f087d2
  vllm: vllm_{node}.log
  mooncake: mooncake_{node}.log
  proxy: proxy.log
