# =============================================================================
# A3 inventory — 4xA3 2P+2D
# 拓扑：Prefill dp4tp8（每节点 2 引擎），Decode dp32 tp1（每节点 16 引擎）
# proxy 落在 p0；mooncake_master 3 节点（p0/p1/d0）
#
# 每节点字段：
#   ansible_host : SSH 目标（控制机登录用）
#   ip           : 节点网卡 IP（= ip addr show <nic> 的值），组件间互通统一用它（etcd/haproxy/mooncake/引擎）
#   nic          : 网卡名（取 ip 的接口）
#   idx          : 该角色内节点序号
# ⚠ ip 字段暂用 ansible_host 值（7.150.x.x），生产环境核对并改成真实网卡 IP。
# =============================================================================
all:
  children:
    prefill:
      hosts:
        p0: { ansible_host: "7.150.11.146", ip: "7.150.11.146", nic: enp23s0f3, idx: 0 }
        p1: { ansible_host: "7.150.11.213", ip: "7.150.11.213", nic: enp23s0f3, idx: 1 }
    decode:
      hosts:
        d0: { ansible_host: "7.150.12.179", ip: "7.150.12.179", nic: enp23s0f3, idx: 0 }
        d1: { ansible_host: "7.150.12.191", ip: "7.150.12.191", nic: enp23s0f3, idx: 1 }
    proxy:  { hosts: { p0: {} } }
    # mooncake_master 3 节点（与 group_vars mooncake.ha.nodes 对齐；group 不参与 start.yml 部署判断，仅供调试）
    mooncake: { hosts: { p0: {}, p1: {}, d0: {} } }