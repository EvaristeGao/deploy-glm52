# =============================================================================
# A3 group_vars/all.yml — 集群级变量（原生化：集群参数并入各 inventory 的 group_vars）
# SSH 连接参数 + 集群参数（平铺，无 nodes/cluster 段；值抄自 config-a3.yaml）
# A3 未实机验证，字段依 A2 蓝本推演，实机跑通后需复核
# =============================================================================

# --- SSH 连接参数（来源：config-a3.yaml ssh 段，所有 playbook 共享）---
ansible_user: root                              # config-a3.yaml ssh.user
# ansible_ssh_private_key_file: /home/g00832294/.ssh/KeyPair-2956.pem  # config-a3.yaml ssh.opts 的 -i
# ansible_password: "Huawei@1234"
ansible_ssh_common_args: "-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o ConnectionAttempts=3 -o ServerAliveInterval=30 -o ServerAliveCountMax=3"  # config-a3.yaml ssh.opts 的 -o 选项 + 重试/心跳（实机瞬时 reset 容错）
ansible_ssh_retries: 3                          # UNREACHABLE 自动重试（实机验证: 节点容器起后 sshd 瞬时不稳会 reset）
ansible_python_interpreter: /usr/bin/python3

# =============================================================================
# 部署配置选择器（与 A2 同一套写法）
#   取值：1m-v030-lw —— v0.30 口径 + Mooncake 分层 KV offload（use_layerwise，实验性，见下）
#        1m-v030    —— ★ 当前启用，严格按 v0.30.0rc1 文档 §5.2.3（A3 1M PD 分离）
#         1m      —— 按 v0.23.0 文档 §5.2.2 + 集群现网参考（A3 1M PD，DP8TP4/DCP4）
#         200k    —— 按 v0.23.0 文档 §5.2.1 + 集群现网参考（A3 198K PD；prefill 用 DP 代替 PP）
# 参考：https://docs.vllm.ai/projects/ascend/en/v0.30.0rc1/tutorials/models/GLM5.2.html
#       https://docs.vllm.ai/projects/ascend/en/v0.23.0/tutorials/models/GLM5.2.html
# =============================================================================
deploy_config: 1m-v030

cluster_type: a3
image: quay.io/ascend/vllm-ascend:v0.30.0rc1-a3
image_tar: ""                 # 非空则 pull.yml 改从该 tar docker load（需节点可见路径，如共享目录）；留空则 docker pull image

# =============================================================================
# 权重 / 模型（200k 与 1m 共用同一份权重，故不进下面的配置块；
#   若将来两档需要不同权重，再把 model_path 各自移入配置块）
#   注意：官方 A3 的 198K / 1M 参考权重都是 w8a8c8，当前用的是 w4a8c8
#   （官方标注 w4a8c8 的 PD 分离为 experimental、有已知精度问题）
# =============================================================================
model_path: "/mnt/sfs_turbo/models/GLM-5.2-w4a8c8"
model_name: glm-52
model:
  path: "{{ model_path }}"
  served_model_name: "{{ model_name }}"
  dir_host: ""        # 非空则挂载 -v <dir_host>:/root/.cache
  mounts:
    - "/mnt/sfs_turbo:/mnt/sfs_turbo"   # 必须写 host:container（单路径会被 docker 当匿名卷，容器内是空的）

# =============================================================================
# 200K 配置（对齐官方 A3 198K PD 分离参考，但 prefill 用 DP 代替 PP）
#   官方：prefill PP2 TP16（2 节点合成 1 个 PP2 引擎）+ decode DP8 TP4（每节点 4 引擎）。
#   本项目 launch_online_dp.py 是纯 DP 启动器，表达不了 PP，故 prefill 取 DP2 TP16
#   （保留官方 TP16，DP 横向铺开 2 节点、每节点 1 引擎）；decode 与官方一致。
#   官方参考 max-model-len 202752；prefill batched-tokens 16384 / decode 164；
#   decode spec tokens 3（1M 档才是 5）；decode HCCL_BUFFSIZE 256（1M 档才是 400）；
#   两侧 --hf-overrides '{"use_index_cache": true, "index_topk_freq": 4}'（1M 档没有）。
#   enable_sparse_sfa_c8 按本项目策略关闭（官方参考为 true；见 c3b1d4d 精度问题）。
# =============================================================================
_200k:
  pd_cluster:
    max_model_len: 202752
    num_cards: 16
    prefill:
      dp_size: 2
      tp_size: 16
      dp_size_local: 1
      base_port: 9081
      kv_port: 30000
      rpc_port: 16591
      max_num_batched_tokens: 16384
      max_num_seqs: 64
      gpu_memory_utilization: 0.92
      # 官方口径：prefix cache 命中率 >0 用 --enable-，=0 用 --no-enable-（参考脚本给的是 enable）
      enable_prefix_caching: true
      hf_overrides: '{"use_index_cache": true, "index_topk_freq": 4}'
      additional_config: '{"multistream_overlap_shared_expert": true, "enable_dsa_cp": true, "enable_sparse_sfa_c8": false, "enable_sparse_li_c8": true, "c8_enable_reshape_optim": true, "ascend_compilation_config": {"fuse_muls_add": true}}'
    decode:
      dp_size: 8
      tp_size: 4
      dp_size_local: 4
      base_port: 9900
      kv_port: 30200
      rpc_port: 16600
      max_num_batched_tokens: 164
      max_num_seqs: 32
      gpu_memory_utilization: 0.92
      num_speculative_tokens: 3
      hccl_buffsize: 256
      # 官方 A3 PD 参考的 decode 脚本一律不带此参数（默认关），集群 1M/128K 参考也都是关
      enable_prefix_caching: false
      hf_overrides: '{"use_index_cache": true, "index_topk_freq": 4}'
      additional_config: '{"multistream_overlap_shared_expert": true, "enable_sparse_sfa_c8": false, "enable_sparse_li_c8": true, "scheduler_config": {"recompute_scheduler_enable": true}, "ascend_compilation_config": {"fuse_muls_add": true}}'

# =============================================================================
# 1M 配置（官方 A3 PD 分离 1M 参考 §5.2.2：P 2 节点 dp2tp16 每节点 1 引擎；
#   D 2 节点 dp8tp4 每节点 4 引擎；prefill 开 DSA CP，decode 开 DCP=4）
#   注意 1：官方参考里 prefill 节点声明 --decode-context-parallel-size 16，
#          decode 节点声明 4（各自本地口径不同），故 prefill 侧单独给
#          decode_context_parallel_size。
#   注意 2：enable_sparse_sfa_c8 本项目**两档都关闭**（沿用 c3b1d4d「关闭 sfa_c8 开关，
#          防止精度问题」）。注意三份集群 1M 参考（yy/GLM5.2-1M、a3-w8a8c8-1MB-nokvpool、
#          didi-1）与官方 1M 参考都是 true —— 这里是有意不跟参考，精度优先。
#          另外一个佐证：官方明确警告「w4a8c8 权重下 DCP + sfa_c8 同开有已知问题，不推荐」，
#          而当前权重正是 w4a8c8、1M 档又开着 DCP，关掉正好规避该组合。
#          若将来换 w8a8c8 权重并确认精度 OK，再考虑开 true。
#   注意 3：prefix caching —— prefill 开（官方参考脚本给 enable）、decode 关
#          （官方 A3 PD 的 decode 脚本一律不带该参数，三份集群参考也都是关）。
# =============================================================================
_1m:
  pd_cluster:
    max_model_len: 1048576
    num_cards: 16
    cp_kv_cache_interleave_size: 128
    prefill:
      dp_size: 2
      tp_size: 16
      dp_size_local: 1
      base_port: 9081
      kv_port: 30000
      rpc_port: 16600
      context_parallel_size: 1
      decode_context_parallel_size: 16
      engine_id: 0
      max_num_seqs: 64
      gpu_memory_utilization: 0.9
      enable_prefix_caching: true
      additional_config: '{"multistream_overlap_shared_expert": true, "enable_dsa_cp": true, "enable_sparse_sfa_c8": false, "enable_sparse_li_c8": true, "c8_enable_reshape_optim": true, "ascend_compilation_config": {"fuse_muls_add": true}}'
    decode:
      dp_size: 8
      tp_size: 4
      dp_size_local: 4
      base_port: 9900
      kv_port: 30200
      rpc_port: 16600
      context_parallel_size: 4
      engine_id: 2
      max_num_batched_tokens: 192
      max_num_seqs: 32
      gpu_memory_utilization: 0.92
      enable_prefix_caching: false
      additional_config: '{"multistream_overlap_shared_expert": true, "enable_sparse_sfa_c8": false, "enable_sparse_li_c8": true, "scheduler_config": {"recompute_scheduler_enable": true}, "ascend_compilation_config": {"fuse_muls_add": true}}'

# =============================================================================
# 1M-v030 配置 —— 严格按 v0.30.0rc1 文档 §5.2.3「PD Disaggregation 1M Deployment」
#   文档：https://docs.vllm.ai/projects/ascend/en/v0.30.0rc1/tutorials/models/GLM5.2.html#52-1m-context-configuration
#   （engine 镜像 quay.io/ascend/vllm-ascend:v0.30.0rc1-a3 对应的版本文档）
#
#   与 v0.23 口径（_200k / _1m）的差异 —— v0.30 是另一代配置：
#     · C8 稀疏优化不再是独立开关：文档原文说明 --kv-cache-dtype int8 +
#       --attention_config.indexer_kv_dtype int8 即「SFA/LI 稀疏注意力 + C8 reshape 优化」，
#       enable_sparse_sfa_c8 / enable_sparse_li_c8 / c8_enable_reshape_optim 三个键已从文档消失
#     · 开关从 env 搬进 additional-config：enable_flashcomm1 / enable_fused_mc2 / enable_mlapo
#     · 新增 --safetensors-load-strategy 'prefetch'、mega_moe_max_tokens
#     · v0.23 的 env（ACL_OP_INIT_MODE / ASCEND_A3_ENABLE / TASK_QUEUE_ENABLE /
#       VLLM_ASCEND_ENABLE_* / HCCL_*_TIMEOUT / OMP_*）文档里已全部删除 → 由 v030_env 精简集替代
#     · decode 拓扑改为 DP4 TP8（每节点 2 引擎）+ DCP 8（v0.23 是 DP8 TP4 + DCP 4）
#     · 各 role 只有首节点对外提供 API：p0/d0 加 --api-server-count，p1/d1 加 --headless
#       （start.yml 的实例清单与 proxy 端点已按 non_master_headless 只取首节点）
#     · 无 --hf-overrides（v0.30 文档已删除该参数）
#   注意：本档没有 enable_sparse_sfa_c8 这类开关；若精度上要避开 SFA/LI，
#        需要去掉 --kv-cache-dtype int8 与 --attention_config.indexer_kv_dtype int8
#        （即删掉下面两处 kv_cache_dtype / indexer_kv_dtype），这与文档配置会有偏离。
# =============================================================================
_1m_v030:
  pd_cluster:
    max_model_len: 1048576
    num_cards: 16
    cp_kv_cache_interleave_size: 128
    v030_env: true              # 渲染 v0.30 §5.2.3 的精简 env 集（见模板）
    prefill:
      dp_size: 2
      tp_size: 16
      dp_size_local: 1
      base_port: 9081
      kv_port: 30000
      rpc_port: 16591
      context_parallel_size: 1
      decode_context_parallel_size: 16
      engine_id: 0
      max_num_batched_tokens: 8192
      max_num_seqs: 64
      gpu_memory_utilization: 0.85
      enable_prefix_caching: true
      safetensors_prefetch: true
      kv_cache_dtype: int8
      indexer_kv_dtype: int8
      # 镜像约束：external DP LB 模式（用了 --data-parallel-rank）禁止 remote engine 用 --headless，
      # 故必须 false —— 两个节点各自起 API server，proxy 端点也相应列全部节点
      non_master_headless: false
      api_server_count: 1
      additional_config: '{"multistream_overlap_shared_expert": true, "enable_dsa_cp": true, "mega_moe_max_tokens": 8192, "enable_flashcomm1": true, "enable_fused_mc2": 1, "ascend_compilation_config": {"fuse_muls_add": true}}'
    decode:
      dp_size: 4
      tp_size: 8
      dp_size_local: 2
      base_port: 9900
      kv_port: 30200
      rpc_port: 16600
      context_parallel_size: 8
      engine_id: 2
      max_num_batched_tokens: 192
      max_num_seqs: 32
      gpu_memory_utilization: 0.9
      num_speculative_tokens: 5
      hccl_buffsize: 400
      enable_prefix_caching: false
      safetensors_prefetch: true
      kv_cache_dtype: int8
      indexer_kv_dtype: int8
      # 镜像约束：external DP LB 模式（用了 --data-parallel-rank）禁止 remote engine 用 --headless，
      # 故必须 false —— 两个节点各自起 API server，proxy 端点也相应列全部节点
      non_master_headless: false
      api_server_count: 1
      additional_config: '{"multistream_overlap_shared_expert": true, "enable_fused_mc2": 1, "enable_mlapo": true, "scheduler_config": {"recompute_scheduler_enable": true}, "ascend_compilation_config": {"fuse_muls_add": true}}'

# =============================================================================
# 1M-v030-layerwise 配置 —— 在 1m-v030 基础上开 Mooncake 分层 KV offload（use_layerwise）
#   功能文档：user_guide/feature_guide/mooncake_hybrid_attention.html
#             user_guide/feature_guide/mooncake_layerwise_adaptation_and_optimization.html
#   原理：把一个 block 的**所有层**打包成 1 个远端对象（对象数 B×L×R → B×R），每层算完
#         只 PUT 该层的 byte range；backend=mooncake + use_layerwise 走 block_key data plane
#         （镜像里 mooncake_layerwise.py 的 LAYERWISE_DATA_PLANE="block_key"），
#         即 hybrid 多 KV-group 路径（key 命名空间 model@mooncake_hybrid_v1:<digest>@group:<id>@...）
#
#   为满足 layerwise 的三条硬约束，本档相对 1m-v030 改了 4 处：
#     1) 不开 CP/DCP（镜像 mooncake_layerwise.validate_topology 明确
#        "supports TP/PP, but not context parallelism"，CP>1 直接 raise）
#     2) P/D 的 TP 一致（validate_runtime: 不支持 prefill/decode TP mismatch；
#        且 PD 分离下 producer/consumer 的 dcp/pcp 也必须一致）→ 两边都 TP8
#     3) decode 改纯 eager（官方要求先 eager 验证，graph mode 需另行集成验证）
#        → enforce_eager: true + async_scheduling: false，不渲染 --compilation-config
#     4) prefill 开 chunked-prefill（layerwise 文档的示例配置带 --enable-chunked-prefill，
#        且 session 的 chunk 续传语义就是为它设计的），chunk 用文档示例的 4096
#   前置条件（重要）：
#     · mooncake client 必须带 PR #2881 的 7 个 range/session 接口
#       （batch_put_session_start / batch_put_from_multi_buffer_ranges / batch_put_session_end /
#         batch_put_session_revoke / batch_get_session_start /
#         batch_get_into_multi_buffer_ranges / batch_get_session_end）；
#       当前镜像的 mooncake 包没有这些接口，启动时会 fail fast 报 "must include Mooncake PR #2881"
#     · 官方标注 real-NPU E2E 尚未完成（只有 CPU mock 单测），属 developer preview
#   调试：需要每层审计日志时给引擎容器加 VLLM_ASCEND_KVPOOL_RANGE_DEBUG=1（默认 0）
# =============================================================================
_1m_v030_lw:
  pd_cluster:
    max_model_len: 1048576
    num_cards: 16
    v030_env: true
    layerwise:
      enabled: true
      prefetch_layers: 2              # 文档建议先用 2；首次硬件验证可降到 1
      max_transfer_blocks: 64
      max_transfer_bytes: 16777216
    prefill:
      dp_size: 4                      # 2 节点 × 每节点 2 引擎
      tp_size: 8                      # 与 decode 的 TP 保持一致（layerwise 硬约束）
      dp_size_local: 2
      base_port: 9081
      kv_port: 30000
      rpc_port: 16591
      engine_id: 0
      max_num_batched_tokens: 4096     # layerwise 文档示例值（配 chunked prefill）
      max_num_seqs: 64
      gpu_memory_utilization: 0.85
      enable_prefix_caching: true
      enable_chunked_prefill: true
      safetensors_prefetch: true
      kv_cache_dtype: int8
      indexer_kv_dtype: int8
      non_master_headless: false
      api_server_count: 1
      # 相对 1m-v030 去掉了 enable_dsa_cp（本档 CP/DCP=1，DSA CP 无意义）
      additional_config: '{"multistream_overlap_shared_expert": true, "mega_moe_max_tokens": 8192, "enable_flashcomm1": true, "enable_fused_mc2": 1, "ascend_compilation_config": {"fuse_muls_add": true}}'
    decode:
      dp_size: 4
      tp_size: 8                      # 与 prefill 一致（layerwise 硬约束）
      dp_size_local: 2
      base_port: 9900
      kv_port: 30200
      rpc_port: 16600
      engine_id: 2
      max_num_batched_tokens: 192
      max_num_seqs: 32
      gpu_memory_utilization: 0.9
      num_speculative_tokens: 5
      hccl_buffsize: 400
      enable_prefix_caching: false
      enforce_eager: true             # layerwise 先 eager 验证
      async_scheduling: false
      safetensors_prefetch: true
      kv_cache_dtype: int8
      indexer_kv_dtype: int8
      non_master_headless: false
      api_server_count: 1
      additional_config: '{"multistream_overlap_shared_expert": true, "enable_fused_mc2": 1, "enable_mlapo": true, "scheduler_config": {"recompute_scheduler_enable": true}, "ascend_compilation_config": {"fuse_muls_add": true}}'

# =============================================================================
# 激活的配置（由 deploy_config 选择；_active 必须先于 pd_cluster 定义，
#   否则 {{ _active.pd_cluster }} 解析时 _active 还是未展开的字符串）
# =============================================================================
_active: "{{ {'200k': _200k, '1m': _1m, '1m-v030': _1m_v030, '1m-v030-lw': _1m_v030_lw}[deploy_config] }}"
pd_cluster: "{{ _active.pd_cluster }}"

# --- 共享字段（与部署配置无关）---
runtime:
  ready_timeout: 2400
  proxy_ready_timeout: 600

proxy:
  port: 8000
  # 接入 proxy 的节点白名单（inventory 节点名）；空/未配置 = 全部接入
  prefill_nodes: []          # 例: [p0]
  decode_nodes: []           # 例: [d0] —— 模拟 decode 排队

# mooncake / 部署模式（三态，详见 README「部署模式」）：
#   enabled=true  + enable_ha=true  → kvpool HA（3 master + 3 etcd + haproxy）
#   enabled=true  + enable_ha=false → kvpool 单 master（p0 裸 mooncake_master，无 etcd/haproxy）★ 当前
#   enabled=false                   → 无 kvpool（直连 MooncakeConnectorV1，无 master/etcd/haproxy）
# 当前用单主：测试阶段不需要 etcd/ha 选主，也就免掉证书目录（etcd.certs_dir）依赖。
mooncake:
  enabled: true              # kvpool(Ascend Store KV 池)开关；false=直连 MooncakeConnectorV1（无池/无 master/无 etcd/haproxy）
  port: 50088                # （当前无任何 playbook/模板引用，保留待用）
  evict: 0.9
  global_segment_size: 40GB
  default_kv_lease_ttl: 11000
  # image: vllm-ascend-ha-gwh-test:v2.0   # TODO: mooncake 容器镜像（含 mooncake_master+haproxy+nc），用户填
  image: quay.io/ascend/vllm-ascend:v0.30.0rc1-a3
  ha:
    enable_ha: false         # ha+etcd 开关（前提 enabled: true）；false=单 master 直连 p0（当前）
    nodes: [p0, p1, d0]      # 3 个 mooncake_master 节点；仅 enable_ha=true 生效（单主时 master 固定落 proxy 节点 p0）
    rpc_port: 52050          # 单主时也是这个端口：mooncake.json 的 master_server_address 直连 p0:此端口
    metrics_port: 52052
    health_check_port: 52054
    eviction_ratio: 0.2
    log_dir: /var/log/mooncake_master

# etcd（3 节点，mooncake_master HA 选主后端）—— 仅 mooncake.ha.enable_ha=true 时使用，单主模式下整段不生效
etcd:
  image: quay.io/coreos/etcd:v3.5.9-arm64
  nodes: [p0, p1, d0]        # TODO: A3 3 个 etcd 节点（同 mooncake master）
  certs_dir: /ce-efs-hd2-01/g00832294/certs   # TODO: 证书目录（假设已有 ca.crt/server.crt/server.key/client.pem）；切回 HA 前必须先确认该路径在宿主机上真实存在
  client_cert: /etc/pki/etcd/certs/client.pem   # haproxy 连 etcd 的客户端证书（容器内路径，挂载自 certs_dir）
  client_port: 2379
  peer_port: 2380

# haproxy（etcd 代理，两种部署形态，见 README「部署模式」）—— 同 etcd，仅 HA 模式生效
#   per_container（默认）：每实例容器内嵌 haproxy（master→cache_master_port, 引擎→pd_port）
#   standalone：3 个独立 haproxy 容器（nodes），组件经 3 节点 IP:port 访问 etcd
haproxy:
  mode: per_container         # per_container | standalone
  image: haproxy-etcd:latest  # standalone：独立 haproxy 容器镜像（构建自 image_build/Dockerfile_ha，改成本地镜像名）
  cache_master_port: 12379   # per_container：mooncake 容器内 haproxy 端口（master -etcd_endpoints 指 127.0.0.1:此端口）
  pd_port: 12489             # per_container：P/D 引擎容器内 haproxy 端口
  nodes: [p0, p1, d0]        # standalone：3 个独立 haproxy 容器节点
  port: 12379                # standalone：统一监听端口（master/引擎共用，经 3 节点 IP:此端口 访问 etcd）

container:
  name: vllm-ascend-gwh-glm52
  shm_size: 1024g

logs:
