# =============================================================================
# A2 group_vars/all.yml — 集群级变量
# =============================================================================

# --- SSH 连接参数 ---
ansible_user: root
ansible_ssh_common_args: "-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o ConnectionAttempts=3 -o ServerAliveInterval=30 -o ServerAliveCountMax=3"
ansible_ssh_retries: 3
ansible_python_interpreter: /usr/bin/python3

# --- 部署配置选择器 ---
#   取值：200k（默认，GLM-5.2 非对称 PD 4P+8D，200K ctx）
#         1m（GLM-5.3 对称 PD 4P+4D，1M ctx + CP/timeouts/profiler）
deploy_config: 1m

image: quay.io/ascend/vllm-ascend:v0.23.0
image_tar: ""
cluster_type: a2

# =============================================================================
# 200K 配置（默认，GLM-5.2，非对称 PD 4P+8D）
# =============================================================================
_200k:
  model_path: /mnt/sfs_turbo/models/GLM-5.2-w4a8c8
  model_name: glm-52
  pd_cluster:
    max_model_len: 200000
    num_cards: 8
    prefill:
      dp_size: 4
      tp_size: 8
      dp_size_local: 1
      base_port: 9081
      kv_port: 30000
      rpc_port: 16591
    decode:
      dp_size: 8
      tp_size: 4
      dp_size_local: 2
      base_port: 9900
      kv_port: 30100
      rpc_port: 16600
    enable_prefix_caching: true
  runtime:
    ready_timeout: 2400
    proxy_ready_timeout: 600
  container_name: glm52-ansible-test

# =============================================================================
# 1MB 配置（GLM-5.3，对称 PD 4P+4D + CP + timeouts + profiler）
# =============================================================================
_1m:
  model_path: /mnt/sfs_turbo/models/GLM-5.3-w4a8c8
  model_name: glm-5
  pd_cluster:
    max_model_len: 1024000
    num_cards: 8
    cp_kv_cache_interleave_size: 128
    prefill:
      dp_size: 4
      tp_size: 8
      dp_size_local: 1
      base_port: 9081
      kv_port: 30000
      rpc_port: 16591
      context_parallel_size: 1
      engine_id: 0
      max_num_seqs: 16
      gpu_memory_utilization: 0.92
    decode:
      dp_size: 4
      tp_size: 8
      dp_size_local: 1
      base_port: 9900
      kv_port: 30100
      rpc_port: 16600
      context_parallel_size: 8
      engine_id: 1
      capture_sizes: [4, 8, 16]
      acl_op_init_mode: true
      max_num_batched_tokens: 16
      max_num_seqs: 16
      gpu_memory_utilization: 0.9
    enable_prefix_caching: true
  runtime:
    ready_timeout: 2400
    proxy_ready_timeout: 600
    timeouts:
      vllm_rpc_timeout: 3600000
      execute_model_timeout_seconds: 30000
      hccl_exec_timeout: 204
      hccl_connect_timeout: 120
  profiler:
    enabled: false
    config: '{"profiler": "torch", "torch_profiler_dir": "/home/lh/prof", "torch_profiler_with_stack": false}'
  container_name: gwh-decode-verify-test

# =============================================================================
# 激活的配置（由 deploy_config 选择）
# =============================================================================
_active: "{{ _1m if deploy_config == '1m' else _200k }}"

model:
  path: "{{ _active.model_path }}"
  served_model_name: "{{ _active.model_name }}"
  dir_host: ""
  mounts:
    - "/mnt/sfs_turbo/:/mnt/sfs_turbo/"
model_path: "{{ _active.model_path }}"
model_name: "{{ _active.model_name }}"
pd_cluster: "{{ _active.pd_cluster }}"
runtime: "{{ _active.runtime }}"
profiler: "{{ _active.profiler | default({}) }}"
container:
  name: "{{ _active.container_name }}"
  shm_size: 1024g

# --- 共享字段（与部署配置无关）---
proxy:
  port: 1999
  prefill_nodes: []
  decode_nodes: []

mooncake:
  enabled: false
  port: 50088
  evict: 0.9
  global_segment_size: 80GB
  default_kv_lease_ttl: 11000
  image: quay.io/ascend/vllm-ascend:v0.23.0
  ha:
    enable_ha: false
    nodes: [p0, p1, p2]
    rpc_port: 52050
    metrics_port: 52052
    health_check_port: 52054
    eviction_ratio: 0.2
    log_dir: /var/log/mooncake_master

etcd:
  image: quay.io/coreos/etcd:v3.7.1-arm64
  nodes: [p0, p1, p2]
  certs_dir: /mnt/sfs_turbo/g00832294/certs
  client_cert: /etc/pki/etcd/certs/client.pem
  client_port: 2379
  peer_port: 2380

haproxy:
  mode: standalone
  image: gwh-haproxy:v1.0
  cache_master_port: 12379
  pd_port: 12489
  nodes: [p0, p1, p2]
  port: 12379

logs:
  dir: /mnt/sfs_turbo/g00832294/deploy-glm52/logs
  vllm: vllm_{node}.log
  mooncake: mooncake_{node}.log
  proxy: proxy_{node}.log