# =============================================================================
# A2 group_vars/all.yml — 集群级变量（原生化：集群参数并入各 inventory 的 group_vars）
# SSH 连接参数 + 集群参数（平铺，无 nodes/cluster 段；值抄自 config.yaml）
# =============================================================================

# --- SSH 连接参数（来源：config.yaml ssh 段，所有 playbook 共享）---
ansible_user: root                              # config.yaml ssh.user
ansible_ssh_common_args: "-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o ConnectionAttempts=3 -o ServerAliveInterval=30 -o ServerAliveCountMax=3"  # config.yaml ssh.opts 的 -o 选项 + 重试/心跳（实机瞬时 reset 容错）
ansible_ssh_retries: 3                          # UNREACHABLE 自动重试（实机验证: 节点容器起后 sshd 瞬时不稳会 reset）
ansible_python_interpreter: /usr/bin/python3

# --- 集群参数（值抄自 config.yaml，平铺、无 nodes/cluster 段）---
cluster_type: a2
image: quay.io/ascend/vllm-ascend:v0.23.0
image_tar: ""                 # 非空则 pull.yml 改从该 tar docker load（需节点可见路径，如共享目录）；留空则 docker pull image
model_path: /mnt/share_space/models/GLM-5.2-w4a8c8
model_name: glm-52
model:
  path: /mnt/share_space/models/GLM-5.2-w4a8c8
  served_model_name: glm-52
  dir_host: ""                    # 非空则挂载 -v <dir_host>:/root/.cache（A3 用）
  mounts:                         # 原 EXTRA_MOUNTS 列表形式，每项一个 -v 参数
    - "/mnt/share_space/:/mnt/share_space/"
    - "/data2:/data2"             # 实机挂载（solution-2 docker-run.sh 确认）

pd_cluster:
  max_model_len: 200000
  num_cards: 8
  prefill: { dp_size: 4, tp_size: 8, dp_size_local: 1, base_port: 9081, kv_port: 30000, rpc_port: 16591 }
  decode:  { dp_size: 8, tp_size: 4, dp_size_local: 2, base_port: 9900, kv_port: 30100, rpc_port: 16600 }
  enable_prefix_caching: true

proxy: { port: 1999 }

# mooncake / 部署模式（三态，详见 README「部署模式」）：
#   enabled=true  + enable_ha=true  → kvpool HA（3 master + 3 etcd + haproxy），当前默认
#   enabled=true  + enable_ha=false → kvpool 单 master（p0 直连，无 etcd/haproxy）
#   enabled=false                   → 无 kvpool（直连 MooncakeConnectorV1，无 master/etcd/haproxy）
mooncake:
  enabled: true              # kvpool(Ascend Store KV 池)开关；false=直连 MooncakeConnectorV1（无池/无 master/无 etcd/haproxy）
  port: 50088                # kv 服务端口（引擎经 haproxy 连入）
  evict: 0.9
  global_segment_size: 80GB
  default_kv_lease_ttl: 11000
  image: quay.io/ascend/vllm-ascend:v0.23.0rc1-mooncake   # TODO: mooncake 容器镜像（含 mooncake_master+haproxy+nc），用户填
  ha:
    enable_ha: true          # ha+etcd 开关（前提 enabled: true）；false=单 master 直连 p0
    nodes: [p0, p1, p2]      # 3 个 mooncake_master 节点（仅 enable_ha=true 生效）
    rpc_port: 52050
    metrics_port: 52052
    health_check_port: 52054
    eviction_ratio: 0.2
    log_dir: /var/log/mooncake_master

# etcd（3 节点，mooncake_master HA 选主后端）
etcd:
  image: quay.io/coreos/etcd:v3.5.16
  nodes: [p0, p1, p2]        # 3 个 etcd 节点（同 mooncake master）
  certs_dir: /mnt/share_space/certs   # TODO: 证书目录（假设已有 ca.crt/server.crt/server.key/client.pem）
  client_cert: /etc/pki/etcd/certs/client.pem   # haproxy 连 etcd 的客户端证书（容器内路径，挂载自 certs_dir）
  client_port: 2379
  peer_port: 2380

# haproxy（etcd 代理，部署在每个实例容器内；对齐 ETCD.md v1.1：每实例 1 个 haproxy 监听 1 端口）
haproxy:
  cache_master_port: 12379   # mooncake 容器内 haproxy 监听端口（mooncake_master -etcd_endpoints 指 127.0.0.1:此端口）
  pd_port: 12489             # P/D 引擎容器内 haproxy 监听端口

container: { name: glm52-ansible-test, shm_size: 1024g }
runtime: { ready_timeout: 2400, proxy_ready_timeout: 600 }

logs:
  dir: /mnt/share_space/g00832294/deploy-glm52/logs   # 共享目录（容器内可见，容器销毁后日志仍在）
  vllm: vllm_{node}.log     # {node} 按节点替换（p0/p1/d0..），避免节点互相覆盖
  mooncake: mooncake_{node}.log   # {node} 按节点替换（3 个 mooncake master 各写各的，避免共享目录互相覆盖）
  proxy: proxy.log
