---
# deploy-glm52 拉取镜像 playbook（每节点 docker pull {{ image }}）
# 会实际拉取镜像、可能占网络/磁盘，故任务 4 只做 syntax-check，不实跑。
# 连接参数来源：config.yaml 的 ssh.opts（同 check.yml）
- name: 拉取镜像
  hosts: all
  gather_facts: no
  vars:
    ansible_user: root                              # 来源：config.yaml ssh.user
    ansible_ssh_private_key_file: /home/g00832294/.ssh/KeyPair-2956.pem
    ansible_ssh_common_args: "-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"
  tasks:
    - name: 加载 config 变量
      include_vars: "../../config.yaml"

    - name: docker pull
      shell: docker pull {{ image }}