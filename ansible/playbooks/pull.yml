---
# deploy-glm52 拉取/加载镜像 playbook
# 两种模式（group_vars 的 image_tar 决定）：
#   image_tar 非空 → 每节点 docker load -i <image_tar>（tar 需节点可见，如共享目录挂载）
#   image_tar 留空  → 每节点 docker pull {{ image }}
# 会实际拉取/加载镜像、可能占网络/磁盘。
# 连接参数统一在 inventories/<集群>/group_vars/all.yml（inventory 自动加载）
- name: 拉取/加载镜像
  hosts: all
  gather_facts: no
  vars:
    # mooncake_master 落点：HA → mooncake.ha.nodes；单主 → proxy 节点（p0）
    mooncake_master_nodes: "{{ mooncake.ha.nodes if mooncake.ha.enable_ha else [groups['proxy'][0]] }}"
  tasks:
    - name: 加载或拉取镜像（已存在则跳过）
      shell: |
        if docker images --format "{{ '{{' }}.Repository{{ '}}' }}:{{ '{{' }}.Tag{{ '}}' }}" | grep -Fxq "{{ image }}"; then
          echo image-already-present
        {% if image_tar | default('') != '' %}
        else
          docker load -i {{ image_tar }}
        {% else %}
        else
          docker pull {{ image }}
        {% endif %}
        fi
      register: pull_result
      changed_when: "'image-already-present' not in pull_result.stdout"   # 已存在(跳过)→ok; 实际 load/pull→changed

    # HA 新增：etcd / mooncake 镜像按节点条件拉取（etcd.nodes / mooncake.ha.nodes），
    #   与引擎镜像同款「已存在则跳过」逻辑；mooncake.image 未配置（TODO）则跳过。
    - name: 拉取 etcd 镜像（etcd.nodes；仅 kvpool+HA；已有则跳过）
      when: mooncake.enabled and mooncake.ha.enable_ha and inventory_hostname in etcd.nodes
      shell: |
        if docker images --format "{{ '{{' }}.Repository{{ '}}' }}:{{ '{{' }}.Tag{{ '}}' }}" | grep -Fxq "{{ etcd.image }}"; then
          echo image-already-present
        else
          docker pull {{ etcd.image }}
        fi
      register: etcd_pull
      changed_when: "'image-already-present' not in etcd_pull.stdout"

    - name: 拉取 mooncake 镜像（仅 kvpool 的 master 节点；mooncake.image 未配置则跳过）
      when: mooncake.enabled and inventory_hostname in mooncake_master_nodes and (mooncake.image | default('')) != ''
      shell: |
        if docker images --format "{{ '{{' }}.Repository{{ '}}' }}:{{ '{{' }}.Tag{{ '}}' }}" | grep -Fxq "{{ mooncake.image }}"; then
          echo image-already-present
        else
          docker pull {{ mooncake.image }}
        fi
      register: mooncake_pull
      changed_when: "'image-already-present' not in mooncake_pull.stdout"