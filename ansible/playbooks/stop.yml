---
# deploy-glm52 停止清理 playbook（停 proxy/mooncake + 删容器）
# 对照 deploy.sh cmd_stop()。会实际停服务/删容器，仅在需要停止集群时运行。
# 连接参数统一在 inventories/<集群>/group_vars/all.yml（inventory 自动加载）
#
# 安全点：容器 --pid=host，容器内 pkill/pgrep 会看到 host 全部进程。
#   - proxy:  锚定 '^python3 .*load_balance_proxy_server_example'（cmdline 以 python3 开头），
#              避免误杀/误判控制机 ssh 会话（其 cmdline 以 ssh 开头，不匹配）。
#   - mooncake:pkill -x mooncake_master 精确匹配进程名，不能 -f（否则会匹配 ssh 会话 cmdline）。
- name: deploy-glm52 停止清理
  hosts: all
  gather_facts: no
  vars:
    # mooncake_master 落点：HA → mooncake.ha.nodes；单主 → proxy 节点（p0）
    mooncake_master_nodes: "{{ mooncake.ha.nodes if mooncake.ha.enable_ha else [groups['proxy'][0]] }}"
  tasks:
    # 对照 deploy.sh cmd_stop(): $pnode=$(...proxy.node) 上停 proxy
    # proxy 节点 = inventory 的 proxy 组首成员（group_vars 无 proxy.node 平铺字段）
    - name: 停 proxy（proxy 节点；--pid=host 锚定 ^python3）
      when: inventory_hostname == groups['proxy'][0]
      shell: docker exec {{ container.name }} pkill -f '^python3 .*load_balance_proxy_server_example' 2>/dev/null || true

    # 对照 deploy.sh cmd_stop(): 停 mooncake_master（pkill -x 精确进程名）。
    # HA 后 mooncake_master 跑在 mooncake.ha.nodes 各节点的 mooncake-<node> 容器内，
    #   不是引擎容器（container.name），也不能只停 p0。
    - name: 停 mooncake_master（master 节点；容器 mooncake-<node>，pkill -x 精确进程名）
      when: mooncake.enabled and inventory_hostname in mooncake_master_nodes
      shell: docker exec mooncake-{{ inventory_hostname }} pkill -x mooncake_master 2>/dev/null || true

    # 对照 deploy.sh cmd_stop(): 全部节点 docker rm -f
    - name: 删引擎容器（全部节点，幂等）
      shell: docker rm -f {{ container.name }} 2>/dev/null || true

    # HA 新增：etcd / mooncake 容器一并清理（stop.yml 语义为完整停止清理，不留残留）
    - name: 删 etcd 容器（etcd.nodes，幂等；仅 kvpool+HA）
      when: mooncake.enabled and mooncake.ha.enable_ha and inventory_hostname in etcd.nodes
      shell: docker rm -f etcd-{{ inventory_hostname }} 2>/dev/null || true

    - name: 删 mooncake 容器（master 节点，幂等）
      when: mooncake.enabled and inventory_hostname in mooncake_master_nodes
      shell: docker rm -f mooncake-{{ inventory_hostname }} 2>/dev/null || true