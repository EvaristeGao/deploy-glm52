---
# deploy-glm52 预检 playbook（只读：SSH 连通 + docker info + docker images）
# 不起任何服务、不占卡。
# 连接参数统一在 inventories/<集群>/group_vars/all.yml（inventory 自动加载）
- name: deploy-glm52 预检
  hosts: all
  gather_facts: no
  vars:
    # mooncake_master 落点：HA → mooncake.ha.nodes；单主 → proxy 节点（p0）
    mooncake_master_nodes: "{{ mooncake.ha.nodes if mooncake.ha.enable_ha else [groups['proxy'][0]] }}"
  tasks:
    - name: SSH 连通
      ping:

    - name: docker 可用
      shell: docker info >/dev/null 2>&1 && echo docker-ok || { echo docker-fail; exit 1; }
      changed_when: false   # 只读探测，不改变状态

    - name: 镜像检查
      shell: >-
        docker images --format "{{ '{{' }}.Repository{{ '}}' }}:{{ '{{' }}.Tag{{ '}}' }}"
        | grep -Fxq "{{ image }}" && echo image-present || { echo image-missing; exit 1; }
      changed_when: false   # 只读探测：present→ok, missing→failed(返回码1)

    # HA 新增：etcd / mooncake 镜像预检（mooncake.image 未配置则跳过）
    - name: etcd 镜像检查（etcd.nodes；仅 kvpool+HA）
      when: mooncake.enabled and mooncake.ha.enable_ha and inventory_hostname in etcd.nodes
      shell: >-
        docker images --format "{{ '{{' }}.Repository{{ '}}' }}:{{ '{{' }}.Tag{{ '}}' }}"
        | grep -Fxq "{{ etcd.image }}" && echo image-present || { echo image-missing; exit 1; }
      changed_when: false

    - name: mooncake 镜像检查（mooncake_master_nodes；mooncake.image 未配置则跳过）
      when: mooncake.enabled and inventory_hostname in mooncake_master_nodes and (mooncake.image | default('')) != ''
      shell: >-
        docker images --format "{{ '{{' }}.Repository{{ '}}' }}:{{ '{{' }}.Tag{{ '}}' }}"
        | grep -Fxq "{{ mooncake.image }}" && echo image-present || { echo image-missing; exit 1; }
      changed_when: false

    - name: haproxy 镜像检查（standalone 的 haproxy.nodes；haproxy.image 未配置则跳过）
      when: mooncake.enabled and mooncake.ha.enable_ha and haproxy.mode == 'standalone' and inventory_hostname in haproxy.nodes and (haproxy.image | default('')) != ''
      shell: >-
        docker images --format "{{ '{{' }}.Repository{{ '}}' }}:{{ '{{' }}.Tag{{ '}}' }}"
        | grep -Fxq "{{ haproxy.image }}" && echo image-present || { echo image-missing; exit 1; }
      changed_when: false