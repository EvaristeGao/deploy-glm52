---
# deploy-glm52 预检 playbook（只读：SSH 连通 + docker info + docker images）
# 不起任何服务、不占卡。
# 连接参数来源：config.yaml 的 ssh.opts
#   -i 私钥                -> ansible_ssh_private_key_file
#   其余 -o 选项            -> ansible_ssh_common_args
- name: deploy-glm52 预检
  hosts: all
  gather_facts: no
  vars:
    ansible_user: root                              # 来源：config.yaml ssh.user
    ansible_ssh_private_key_file: /home/g00832294/.ssh/KeyPair-2956.pem
    ansible_ssh_common_args: "-o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"
  tasks:
    - name: 加载 config 变量（顶层字段如 image/model/container 变为同名变量）
      include_vars: "../../config.yaml"

    - name: SSH 连通
      ping:

    - name: docker 可用
      shell: docker info >/dev/null 2>&1 && echo docker-ok || { echo docker-fail; exit 1; }

    - name: 镜像检查
      shell: >-
        docker images --format "{{ '{{' }}.Repository{{ '}}' }}:{{ '{{' }}.Tag{{ '}}' }}"
        | grep -Fq "{{ image }}" && echo image-present || { echo image-missing; exit 1; }