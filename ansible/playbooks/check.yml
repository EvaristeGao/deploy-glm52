---
# deploy-glm52 预检 playbook（只读：SSH 连通 + docker info + docker images）
# 不起任何服务、不占卡。
# 连接参数统一在 group_vars/all.yml 定义（来源：config.yaml 的 ssh 段）
- name: deploy-glm52 预检
  hosts: all
  gather_facts: no
  tasks:
    - name: SSH 连通
      ping:

    - name: docker 可用
      shell: docker info >/dev/null 2>&1 && echo docker-ok || { echo docker-fail; exit 1; }

    - name: 镜像检查
      shell: >-
        docker images --format "{{ '{{' }}.Repository{{ '}}' }}:{{ '{{' }}.Tag{{ '}}' }}"
        | grep -Fq "{{ image }}" && echo image-present || { echo image-missing; exit 1; }