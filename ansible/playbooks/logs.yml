---
# deploy-glm52 查看日志 playbook（对照 deploy.sh cmd_logs）
# 只读（tail 日志），不占卡、不起服务。连接参数统一在 group_vars/all.yml。
#
# 用法（--extra-vars 传 target，可选 tail；target 支持 节点名 / mooncake / proxy）：
#   ansible-playbook -i ansible/inventory.yaml ansible/playbooks/logs.yml -e "target=p0"
#   ansible-playbook ... -e "target=mooncake"          # p0 上 logs.mooncake
#   ansible-playbook ... -e "target=proxy"             # proxy 节点 logs.proxy
#   ansible-playbook ... -e "target=d1 tail=200"       # 指定行数（缺省 100）
#
# 目标节点/日志路径在 play vars 用 group_vars 平铺变量计算（hosts 模式需在任务前解析，
# 故用 vars 段直接取 group_vars）。{node} 占位按 target 节点替换（vllm 日志按节点区分）。
- name: deploy-glm52 查看日志
  hosts: "{{ target_host }}"
  gather_facts: no
  vars:
    # 配置源 group_vars/inventory 平铺（image/container/logs/proxy 等）
    # target 缺省 p0（读 p0 的 vllm 日志，只读安全）；显式 -e target=... 覆盖
    tgt: "{{ target | default('p0') }}"
    # target==proxy 时落到 proxy 组首成员；否则 target 即节点名
    target_node: "{{ tgt if tgt != 'proxy' else groups['proxy'][0] }}"
    # hosts 模式：mooncake→p0；proxy→proxy 组首成员；其余→target 节点
    target_host: >-
      {%- if tgt == 'mooncake' -%}p0
      {%- elif tgt == 'proxy' -%}{{ groups['proxy'][0] }}
      {%- else -%}{{ tgt }}
      {%- endif -%}
    logs_dir: "{{ logs.dir | default('') }}"   # 空回退 /root（对照 deploy.sh LOGS_DIR）
    log_path: >-
      {%- if tgt == 'mooncake' -%}{{ (logs_dir or '/root') }}/{{ logs.mooncake | default('mooncake.log') }}
      {%- elif tgt == 'proxy' -%}{{ (logs_dir or '/root') }}/{{ logs.proxy | default('proxy.log') }}
      {%- else -%}{{ (logs_dir or '/root') }}/{{ logs.vllm | default('vllm_{node}.log') | replace('{node}', target_node) }}
      {%- endif -%}
  tasks:
    - name: 输出日志（tail）
      shell: docker exec {{ container.name }} tail -n {{ tail | default(100) }} {{ log_path }}
      register: log_output
      changed_when: false   # 只读

    - name: 显示日志内容
      debug:
        var: log_output.stdout_lines   # 行列表，每日志行一项，避免 \n 转义