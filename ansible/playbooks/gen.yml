---
# deploy-glm52 gen playbook（只渲染，不实机；对照 deploy.sh gen）
# 在控制端 localhost 执行：把每个节点的 run_dp_template.sh 渲染到 ansible/generated/，
#   并渲染 ansible/generated/mooncake.json（供 start.yml 分发，去除对 deploy.sh gen 的外部依赖）。
# 运行时引擎参数（$1..$7）保留为位置参数，由 launch_online_dp.py 在容器内按每引擎传入，
#   这里只渲染部署期确定的变量（与 start.yml 的 template 任务完全一致）。
# 只读 + 本地写 ansible/generated/，不 ssh 节点、不起服务、不占卡。
# 近似 --dry-run：渲染产物可人工审查，效果等同 `deploy.sh gen` 的调试用途。
# 配置源：group_vars/inventory 平铺（model/pd_cluster/cluster_type/mooncake/container 等），不再读 config.yaml。
- name: deploy-glm52 gen（渲染各节点模板 + mooncake.json 到 ansible/generated/）
  hosts: localhost
  gather_facts: no
  vars:
    # 输出到 ansible/generated/（playbook_dir = ansible/playbooks，../generated = ansible/generated）
    gen_dir: "{{ playbook_dir }}/../generated"
  tasks:
    - name: 渲染各节点 run_dp_template.sh 到 ansible/generated/（对照 deploy.sh cmd_gen 的 render_template 循环）
      vars:
        node_role: "{{ 'prefill' if item[0] == 'p' else 'decode' }}"
        nic: "{{ hostvars[item].nic }}"
        # model_path / cluster_type 已是 group_vars 顶层变量，模板直接读取，不再在 task vars 重定义
        #   （task vars 引用同名 group_vars 变量会触发 Ansible 递归，故不在此列出）
        served_model_name: "{{ model.served_model_name | default(model_name) }}"
        max_model_len: "{{ pd_cluster.max_model_len }}"
        kv_port: "{{ pd_cluster[node_role].kv_port }}"
        # gen 为控制端调试，local_ip 用 inventory 的静态 ansible_host（非节点 register，
        #   语义同 resolve_node 的静态 LOCAL_IP = 节点 IP）
        local_ip: { stdout: "{{ hostvars[item].ansible_host }}" }
        prefill_dp: "{{ pd_cluster.prefill.dp_size }}"
        prefill_tp: "{{ pd_cluster.prefill.tp_size }}"
        decode_dp: "{{ pd_cluster.decode.dp_size }}"
        decode_tp: "{{ pd_cluster.decode.tp_size }}"
        mooncake_config_path: "/root/pd/mooncake.json"
      template:
        src: "../templates/run_dp_{{ node_role }}_template.sh.j2"
        dest: "{{ gen_dir }}/run_dp_template_{{ item }}.sh"
      loop: "{{ groups['all'] | sort }}"

    # 对照 deploy.sh render_mooncake_json()：master 地址 = prefill 首节点 IP + mooncake.port。
    # 改为 group_vars 平铺变量直接渲染（不再调 render_mooncake.py --config config.yaml）。
    # 注：config.yaml 的 mooncake.config.global_segment_size/default_kv_lease_ttl 未进 group_vars，
    #   此处用与 render_mooncake.py 一致的默认值（80GB / 11000），group_vars 补字段后自动生效。
    - name: 渲染 mooncake.json（Jinja2 替代 render_mooncake.py，去 config.yaml 依赖）
      vars:
        master_ip: "{{ hostvars[groups['prefill'][0]].ansible_host }}"
      copy:
        dest: "{{ gen_dir }}/mooncake.json"
        content: |
          {
            "metadata_server": "P2PHANDSHAKE",
            "protocol": "ascend",
            "device_name": "",
            "master_server_address": "{{ master_ip }}:{{ mooncake.port }}",
            "global_segment_size": "{{ mooncake.global_segment_size | default('80GB') }}",
            "default_kv_lease_ttl": {{ mooncake.default_kv_lease_ttl | default(11000) }}
          }