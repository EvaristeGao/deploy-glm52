---
# deploy-glm52 — 第一阶段 start playbook（起容器 + 分发启动文件 + mooncake_master）
# 对照 deploy.sh: start_node() + start_mooncake_master()
# 连接参数统一在 group_vars/all.yml（来源：config.yaml 的 ssh 段）
#
# 安全点：容器 --pid=host，容器内 pkill/pgrep 会看到 host 全部进程。
#   必须用 -x 精确匹配进程名（mooncake_master），不能用 -f——
#   否则会匹配 Ansible 的 ssh 会话（其命令行含这些字符串）而误杀/误判连接。
#
# 阶段 tags（对应 deploy.sh 子流程，便于分段重跑/排查）：
#   container / mooncake / engine / wait / proxy / smoke
#   `--tags engine` 等只跑对应阶段；配置加载（include_vars / cfg）标 always 恒执行。
#   --dry-run 近似：Ansible 无 dry-run 子命令，用 `--check` 试跑（渲染/命令任务只报告不执行）。
- name: deploy-glm52 一键部署（第一阶段：起容器 + 分发 + mooncake）
  hosts: all
  gather_facts: no
  tasks:
    - name: 加载 config 变量（顶层字段 image/model/container 等变为同名变量）
      include_vars: "../../config.yaml"
      tags: always

    - name: 删除旧容器（幂等，对照 deploy.sh 的 docker rm -f $CONTAINER_NAME）
      shell: docker rm -f {{ container.name }} 2>/dev/null || true
      tags: container

    - name: 起容器（对照 deploy.sh start_node 的 docker run，无遗漏）
      shell: |
        docker run -itd --name {{ container.name }} \
        --net=host --pid=host --privileged --shm-size={{ container.shm_size }} \
        {% for i in range(pd_cluster.num_cards) %}--device /dev/davinci{{ i }} {% endfor %}\
        --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -v /etc/hccn.conf:/etc/hccn.conf \
        {% for m in model.mounts %}-v {{ m }} {% endfor %}\
        {% if model.dir_host %}-v {{ model.dir_host }}:/root/.cache {% endif %}\
        {{ image }} bash
      tags: container

    - name: 分发启动文件到各节点 /tmp（对照 deploy.sh 的 scpn）
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
      loop:
        - { src: "../../launch_online_dp.py", dest: "/tmp/launch_online_dp.py" }
        - { src: "../../generated/mooncake.json", dest: "/tmp/mooncake.json" }
      tags: container

    - name: docker cp 启动文件进容器 /root/pd/（对照 deploy.sh start_node）
      shell: docker exec {{ container.name }} mkdir -p /root/pd && docker cp /tmp/{{ item }} {{ container.name }}:/root/pd/
      loop:
        - launch_online_dp.py
        - mooncake.json
      tags: container

    - name: 计算 mooncake 日志路径（logs.dir 为空回退 /root，对照 deploy.sh MOONCAKE_LOG）
      set_fact:
        mooncake_log: "{{ (logs.dir | default('')) or '/root' }}/{{ logs.mooncake | default('mooncake.log') }}"
      tags: mooncake

    - name: mooncake_master 起在 p0（对照 deploy.sh start_mooncake_master，pkill -x 精确匹配）
      when: inventory_hostname == 'p0'
      shell: |
        docker exec {{ container.name }} mkdir -p {{ mooncake_log | dirname }} 2>/dev/null || true
        docker exec {{ container.name }} pkill -x mooncake_master 2>/dev/null || true
        docker exec -d {{ container.name }} bash -c 'mooncake_master -port {{ mooncake.port }} -eviction_high_watermark_ratio {{ mooncake.evict }} >> {{ mooncake_log }} 2>&1'
        sleep 2 && docker exec {{ container.name }} pgrep -x mooncake_master >/dev/null
      tags: mooncake

    # ==================== 第二阶段：引擎（任务 6，对照 deploy.sh start_engines） ====================
    # 核心：Jinja2 模板的 local_ip 用节点命令 register（节点命令替换，非静态值），
    #       启动参数用 resolve filter（resolve_node 大写 KEY → 小写模板变量）。
    # 安全点：只渲染模板 + 起引擎，不实机跑（syntax-check 只验语法）。

    - name: 读取 config 全量 dict（供 resolve filter；include_vars 只拆了顶层字段）
      set_fact:
        cfg: "{{ lookup('file', playbook_dir + '/../../config.yaml') | from_yaml }}"
      tags: always

    - name: resolve_node 计算本节点启动参数（大写 KEY）
      set_fact:
        node_cfg: "{{ cfg | resolve_node(inventory_hostname) }}"
      tags: engine

    - name: 组装模板变量（filter 大写 KEY → 小写模板变量，+ 跨角色 dp/tp + mooncake 路径）
      set_fact:
        node_role: "{{ node_cfg['ROLE'] }}"
        nic: "{{ node_cfg['NIC'] }}"
        model_path: "{{ node_cfg['MODEL_PATH'] }}"
        served_model_name: "{{ node_cfg['SERVED_MODEL_NAME'] }}"
        max_model_len: "{{ node_cfg['MAX_MODEL_LEN'] }}"
        kv_port: "{{ node_cfg['KV_PORT'] }}"
        start_port: "{{ node_cfg['VLLM_START_PORT'] }}"
        dp_size: "{{ node_cfg['DP_SIZE'] }}"
        dp_size_local: "{{ node_cfg['DP_SIZE_LOCAL'] }}"
        dp_rank: "{{ node_cfg['DP_RANK_START'] }}"
        dp_address: "{{ node_cfg['DP_ADDRESS'] }}"
        rpc_port: "{{ node_cfg['DP_RPC_PORT'] }}"
        tp_size: "{{ node_cfg['TP_SIZE'] }}"
        cluster_type: "{{ node_cfg['CLUSTER_TYPE'] }}"
        prefill_dp: "{{ cfg['pd_cluster']['prefill']['dp_size'] }}"
        prefill_tp: "{{ cfg['pd_cluster']['prefill']['tp_size'] }}"
        decode_dp: "{{ cfg['pd_cluster']['decode']['dp_size'] }}"
        decode_tp: "{{ cfg['pd_cluster']['decode']['tp_size'] }}"
        mooncake_config_path: "/root/pd/mooncake.json"
      tags: engine

    - name: 计算 vllm 日志路径（logs.dir 为空回退 /root，{node} 按节点替换，对照 deploy.sh vllm_log）
      set_fact:
        vllm_log: "{{ (logs.dir | default('')) or '/root' }}/{{ logs.vllm | default('vllm_{node}.log') | replace('{node}', inventory_hostname) }}"
      tags: engine

    - name: 本机 IP（节点命令替换核心，register 供模板 local_ip.stdout）
      shell: ip -4 addr show {{ nic }} | grep -oP 'inet \K[0-9.]+' | head -1
      register: local_ip
      tags: engine

    - name: 渲染 run_dp_template.sh（每节点，dest 为节点 /tmp，模板用本机 local_ip）
      template:
        src: "../templates/run_dp_{{ node_role }}_template.sh.j2"
        dest: "/tmp/run_dp_template_{{ inventory_hostname }}.sh"
      tags: engine

    - name: docker cp 模板进容器 /root/pd/run_dp_template.sh（对照 deploy.sh start_node）
      shell: docker cp /tmp/run_dp_template_{{ inventory_hostname }}.sh {{ container.name }}:/root/pd/run_dp_template.sh
      tags: engine

    - name: 启动引擎（对照 deploy.sh start_engines，docker exec -d 后台）
      shell: |
        docker exec {{ container.name }} mkdir -p {{ vllm_log | dirname }} 2>/dev/null || true
        docker exec -d {{ container.name }} bash -c 'cd /root/pd && python3 launch_online_dp.py \
          --dp-size {{ dp_size }} --tp-size {{ tp_size }} --dp-size-local {{ dp_size_local }} \
          --dp-rank-start {{ dp_rank }} --dp-address {{ dp_address }} \
          --dp-rpc-port {{ rpc_port }} --vllm-start-port {{ start_port }} >> {{ vllm_log }} 2>&1'
      tags: engine

    # ==================== wait_ready（对照 deploy.sh cmd_start 的 wait_ready 段） ====================
    # 实例清单经 run_once 在控制端生成（resolve_instances 返回 role ip port，跳过 proxy）；
    # retries 由 runtime.ready_timeout 折算（2400s / 15s = 160）
    - name: 等待全部实例就绪（uri + until，遍历 resolve_instances）
      run_once: true
      uri:
        url: "http://{{ item[1] }}:{{ item[2] }}/health"
        status_code: 200
        timeout: 5
      register: result
      until: result.status == 200
      retries: "{{ (runtime.ready_timeout | default(2400)) | int // 15 }}"
      delay: 15
      loop: "{{ cfg | resolve_instances }}"
      when: item[0] != 'proxy'
      tags: wait

    # ==================== proxy + 冒烟（任务 7，对照 deploy.sh start_proxy + wait_ready proxy + smoke_test） ====================
    # 端点来源：resolve_router filter 返回 dict（PROXY_HOST/PROXY_PORT/PREFILLER_HOSTS/PREFILLER_PORTS/DECODER_HOSTS/DECODER_PORTS）。
    #   多值字段（PREFILLER_HOSTS 等）在 filter 里已按空白拆成 list，这里 join(' ') 还原成空格分隔，
    #   与 deploy.sh proxy_args 里 '$PREFILLER_HOSTS' 展开效果一致（proxy 脚本 nargs='+' 接收）。
    # 安全点：容器 --pid=host，pkill 锚定 '^python3 .*load_balance_proxy_server_example'，
    #   避免误杀控制机 ssh 会话（其 cmdline 以 ssh 开头，不匹配）。

    - name: resolve_router 计算 proxy 端点（大写 KEY dict）
      set_fact:
        router_cfg: "{{ cfg | resolve_router }}"
      tags: proxy

    - name: 组装 proxy 模板变量（filter 大写 KEY → 小写模板变量；多值列表 join(' ') 展开）
      set_fact:
        proxy_host: "{{ router_cfg['PROXY_HOST'] }}"
        proxy_port: "{{ router_cfg['PROXY_PORT'] }}"
        prefiller_hosts: "{{ router_cfg['PREFILLER_HOSTS'] | join(' ') }}"
        prefiller_ports: "{{ router_cfg['PREFILLER_PORTS'] | join(' ') }}"
        decoder_hosts: "{{ router_cfg['DECODER_HOSTS'] | join(' ') }}"
        decoder_ports: "{{ router_cfg['DECODER_PORTS'] | join(' ') }}"
      tags: proxy

    - name: 计算 proxy 日志路径（logs.dir 为空回退 /root，对照 deploy.sh PROXY_LOG）
      set_fact:
        proxy_log: "{{ (logs.dir | default('')) or '/root' }}/{{ logs.proxy | default('proxy.log') }}"
      tags: proxy

    - name: 分发 proxy 脚本到节点 /tmp（对照 deploy.sh 的 scpn）
      copy:
        src: "../../load_balance_proxy_server_example.py"
        dest: "/tmp/load_balance_proxy_server_example.py"
      when: inventory_hostname == 'p0'
      tags: proxy

    - name: docker cp proxy 脚本进容器并启动（对照 deploy.sh start_proxy，pkill 锚定 ^python3）
      when: inventory_hostname == 'p0'
      shell: |
        docker exec {{ container.name }} mkdir -p /root/pd 2>/dev/null || true
        docker cp /tmp/load_balance_proxy_server_example.py {{ container.name }}:/root/pd/
        docker exec {{ container.name }} chmod +x /root/pd/load_balance_proxy_server_example.py
        docker exec {{ container.name }} pkill -f '^python3 .*load_balance_proxy_server_example' 2>/dev/null || true
        docker exec -d {{ container.name }} bash -c 'unset http_proxy https_proxy; python3 /root/pd/load_balance_proxy_server_example.py \
          --host 0.0.0.0 --port {{ proxy_port }} \
          --prefiller-hosts {{ prefiller_hosts }} --prefiller-ports {{ prefiller_ports }} \
          --decoder-hosts {{ decoder_hosts }} --decoder-ports {{ decoder_ports }} >> {{ proxy_log }} 2>&1'
      tags: proxy

    - name: 等待 proxy /healthcheck 就绪（uri + until，对照 deploy.sh wait_ready "proxy"）
      when: inventory_hostname == 'p0'
      uri:
        url: "http://{{ proxy_host }}:{{ proxy_port }}/healthcheck"
        status_code: 200
        timeout: 5
      register: proxy_health
      until: proxy_health.status == 200
      retries: "{{ (runtime.proxy_ready_timeout | default(600)) | int // 15 }}"
      delay: 15
      tags: proxy

    - name: 冒烟测试（control 端 POST /v1/completions，对照 deploy.sh smoke_test）
      when: inventory_hostname == 'p0'
      delegate_to: localhost
      uri:
        url: "http://{{ proxy_host }}:{{ proxy_port }}/v1/completions"
        method: POST
        body:
          model: "{{ model.served_model_name }}"
          prompt: "The future of AI is"
          max_completion_tokens: 20
          temperature: 0
        body_format: json
        status_code: 200
      register: smoke
      until: smoke.status == 200
      retries: 10
      delay: 5
      tags: smoke
