---
# deploy-glm52 — 第一阶段 start playbook（起容器 + 分发启动文件 + mooncake_master）
# 对照 deploy.sh: start_node() + start_mooncake_master()
# 连接参数统一在 inventories/<集群>/group_vars/all.yml（inventory 自动加载）
#
# 安全点：容器 --pid=host，容器内 pkill/pgrep 会看到 host 全部进程。
#   必须用 -x 精确匹配进程名（mooncake_master），不能用 -f——
#   否则会匹配 Ansible 的 ssh 会话（其命令行含这些字符串）而误杀/误判连接。
#
# 阶段 tags（对应 deploy.sh 子流程，便于分段重跑/排查）：
#   container / mooncake / engine / wait / proxy / smoke
#   `--tags engine` 等只跑对应阶段；变量来自 group_vars（inventory 自动加载）。
#   --dry-run 近似：Ansible 无 dry-run 子命令，用 `--check` 试跑（渲染/命令任务只报告不执行）。
- name: deploy-glm52 一键部署（第一阶段：起容器 + 分发 + mooncake）
  hosts: all
  gather_facts: no
  vars:
    # mooncake_master 落点：HA → mooncake.ha.nodes；单主 → proxy 节点（p0）
    mooncake_master_nodes: "{{ mooncake.ha.nodes if mooncake.ha.enable_ha else [groups['proxy'][0]] }}"
  tasks:
    - name: 校验部署模式组合（ha+etcd 依赖 kvpool）
      run_once: true
      assert:
        that:
          - not mooncake.ha.enable_ha or mooncake.enabled
        fail_msg: "mooncake.ha.enable_ha=true 要求 mooncake.enabled=true（etcd/haproxy 为 mooncake_master 选主服务，离开 kvpool 无意义）。请设 mooncake.enabled=true，或关闭 mooncake.ha.enable_ha。"
      tags: always

    - name: 删除旧容器（幂等，对照 deploy.sh 的 docker rm -f $CONTAINER_NAME）
      # 2026-10-19 实机踩到：docker rm -f 返回 0 但容器仍在（exit 137 的残留），紧接着
      # docker run 撞名（Conflict / rc=125）⇒ 该节点没有引擎容器，P 的 DP rendezvous 白等 600s。
      # 这里 rm 后轮询确认名字真的释放，最多重试 10 次，仍存在则 fail-fast。
      shell: |
        docker rm -f {{ container.name }} >/dev/null 2>&1 || true
        for i in $(seq 1 10); do
          if ! docker inspect {{ container.name }} >/dev/null 2>&1; then exit 0; fi
          sleep 1
          docker rm -f {{ container.name }} >/dev/null 2>&1 || true
        done
        if docker inspect {{ container.name }} >/dev/null 2>&1; then
          echo "container {{ container.name }} still exists after rm -f retries" >&2
          docker ps -a --filter name=^{{ container.name }}$ >&2 || true
          exit 1
        fi
      tags: container

    - name: 起容器（对照 deploy.sh start_node 的 docker run，无遗漏）
      shell: |
        docker run -itd --name {{ container.name }} \
        --net=host --privileged --shm-size={{ container.shm_size }} \
        {% for i in range(pd_cluster.num_cards) %}--device /dev/davinci{{ i }} {% endfor %}\
        --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc \
        -v /usr/local/dcmi:/usr/local/dcmi \
        -v /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool \
        -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
        -v /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/ \
        -v /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info \
        -v /etc/ascend_install.info:/etc/ascend_install.info \
        -v /etc/hccn.conf:/etc/hccn.conf \
        {% if mooncake.enabled and mooncake.ha.enable_ha %}-v {{ etcd.certs_dir }}:/etc/pki/etcd/certs {% endif %}\
        {% for m in model.mounts %}-v {{ m }} {% endfor %}\
        {% if model.dir_host %}-v {{ model.dir_host }}:/root/.cache {% endif %}\
        {% set _dm = pd_cluster.debug_mounts_decode if ('decode' in group_names and pd_cluster.debug_mounts_decode is defined) else pd_cluster.debug_mounts %}\
        {% if _dm is defined %}{% for _h, _c in _dm.items() %}-v {{ _h }}:{{ _c }}:ro {% endfor %}{% endif %}\
        {{ image }} bash
      tags: container

    - name: 校验 generated/mooncake.json 存在（generated/ 被 .gitignore 忽略，首次部署必缺）
      delegate_to: localhost
      run_once: true
      stat:
        path: "{{ playbook_dir }}/../generated/mooncake.json"
      register: mooncake_json_stat
      when: mooncake.enabled
      tags: container

    - name: generated/mooncake.json 缺失——请先跑 gen.yml 生成
      delegate_to: localhost
      run_once: true
      fail:
        msg: "缺少 {{ playbook_dir }}/../generated/mooncake.json。generated/ 在 .gitignore（不随仓库交付），首次部署需先在 ansible/ 下运行 gen 生成后再跑本 playbook：ansible-playbook -i inventories/<集群>/inventory.yaml playbooks/gen.yml"
      when: mooncake.enabled and not mooncake_json_stat.stat.exists
      tags: container

    - name: 分发启动文件到各节点 /tmp（对照 deploy.sh 的 scpn；mooncake.json 仅 kvpool）
      copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
      loop:
        - { src: "../launch_online_dp.py", dest: "/tmp/launch_online_dp.py", only_kvpool: false }
        - { src: "../generated/mooncake.json", dest: "/tmp/mooncake.json", only_kvpool: true }
      when: not (item.only_kvpool | default(false)) or mooncake.enabled
      tags: container

    - name: docker cp 启动文件进容器 /root/pd/（对照 deploy.sh start_node；mooncake.json 仅 kvpool）
      shell: docker exec {{ container.name }} mkdir -p /root/pd && docker cp /tmp/{{ item.name }} {{ container.name }}:/root/pd/
      loop:
        - { name: launch_online_dp.py, only_kvpool: false }
        - { name: mooncake.json, only_kvpool: true }
      when: not (item.only_kvpool | default(false)) or mooncake.enabled
      tags: container

    - name: 计算 mooncake 日志路径（logs.dir 为空回退 /root，{node} 按节点替换，对照 deploy.sh MOONCAKE_LOG）
      set_fact:
        mooncake_log: "{{ (logs.dir | default('')) or '/root' }}/{{ logs.mooncake | default('mooncake.log') | replace('{node}', inventory_hostname) }}"
      tags: mooncake

    # ==================== mooncake_master HA：etcd 3 节点 + 3 master + haproxy（同 mooncake 容器） ====================

    - name: 计算 etcd 集群参数（initial-cluster 供 etcd 互连；etcd_server_list 供 gen_haproxy_etcd.sh）
      run_once: true
      delegate_to: localhost
      set_fact:
        etcd_initial_cluster: "{% for n in etcd.nodes %}s{{ loop.index }}=https://{{ hostvars[n].ip }}:{{ etcd.peer_port }}{% if not loop.last %},{% endif %}{% endfor %}"
        etcd_server_list: "{% for n in etcd.nodes %}{{ hostvars[n].ip }}:{{ etcd.client_port }}{% if not loop.last %};{% endif %}{% endfor %}"
        # master 的 -etcd_endpoints：per_container → 本机 haproxy；standalone → 3 个独立 haproxy
        master_etcd_endpoints: "{% if haproxy.mode == 'standalone' %}{% for n in haproxy.nodes %}{{ hostvars[n].ip }}:{{ haproxy.port }}{% if not loop.last %};{% endif %}{% endfor %}{% else %}127.0.0.1:{{ haproxy.cache_master_port }}{% endif %}"
      when: mooncake.enabled and mooncake.ha.enable_ha
      tags: etcd

    - name: 起 etcd 容器（3 节点，证书挂载，双向证书认证；仅 kvpool+HA）
      when: mooncake.enabled and mooncake.ha.enable_ha and inventory_hostname in etcd.nodes
      shell: |
        docker rm -f etcd-{{ inventory_hostname }} 2>/dev/null || true
        docker run -d --name etcd-{{ inventory_hostname }} --network host \
          -v {{ etcd.certs_dir }}:/certs \
          {{ etcd.image }} \
          etcd --name s{{ etcd.nodes.index(inventory_hostname) + 1 }} --data-dir /etcd-data \
          --listen-client-urls https://0.0.0.0:{{ etcd.client_port }} \
          --advertise-client-urls https://{{ ip }}:{{ etcd.client_port }} \
          --listen-peer-urls https://0.0.0.0:{{ etcd.peer_port }} \
          --initial-advertise-peer-urls https://{{ ip }}:{{ etcd.peer_port }} \
          --initial-cluster {{ etcd_initial_cluster }} \
          --client-cert-auth --trusted-ca-file=/certs/ca.crt --cert-file=/certs/server.crt --key-file=/certs/server.key \
          --peer-client-cert-auth --peer-trusted-ca-file=/certs/ca.crt --peer-cert-file=/certs/server.crt --peer-key-file=/certs/server.key
      tags: etcd

    - name: 起 mooncake 容器（HA：mooncake.ha.nodes；单主：proxy 节点；独立于 vllm-ascend，含 mooncake_master+haproxy+nc）
      when: mooncake.enabled and inventory_hostname in mooncake_master_nodes
      shell: |
        docker rm -f mooncake-{{ inventory_hostname }} 2>/dev/null || true
        docker run -itd --name mooncake-{{ inventory_hostname }} --shm-size=500g --network host \
          --device=/dev/davinci_manager \
          --device=/dev/hisi_hdc \
          --device=/dev/devmm_svm \
          --entrypoint=bash \
          -v /usr/local/Ascend/driver:/usr/local/Ascend/driver \
          -v /usr/local/dcmi:/usr/local/dcmi \
          -v /usr/local/bin/npu-smi:/usr/local/bin/npu-smi \
          -v /etc/ascend_install.info:/etc/ascend_install.info \
          -v /usr/local/sbin:/usr/local/sbin \
          -v /etc/hccn.conf:/etc/hccn.conf \
          -v /usr/bin/hccn_tool:/usr/bin/hccn_tool \
          -v /usr/share/zoneinfo/Asia/Shanghai:/etc/localtime \
          {# etcd 证书只在 HA（有 etcd）时需要；单主模式不挂，免得 bind 一个不存在的宿主机目录 #}
          {% if mooncake.ha.enable_ha %}-v {{ etcd.certs_dir }}:/etc/pki/etcd/certs {% endif %}\
          {% if logs.dir | default('') %}-v {{ logs.dir }}:{{ logs.dir }} {% endif %}\
          {{ mooncake.image }}
      tags: mooncake

    - name: 分发 haproxy 脚本进节点 /tmp（gen_haproxy_etcd.sh + start-ha.sh，原版）
      copy:
        src: "{{ item }}"
        dest: "/tmp/{{ item | basename }}"
      loop:
        - ../ha/gen_haproxy_etcd.sh
        - ../ha/start-ha.sh
      when: mooncake.enabled and mooncake.ha.enable_ha
      tags: haproxy   # 仅 HA 分发脚本（mooncake 容器 + P/D 引擎容器共用）

    # standalone：3 个独立 haproxy 容器（复用 mooncake.image，含 haproxy；组件经 3 节点 IP 访问 etcd）
    - name: 起独立 haproxy 容器（standalone：haproxy.nodes 各 1 个）
      when: mooncake.enabled and mooncake.ha.enable_ha and haproxy.mode == 'standalone' and inventory_hostname in haproxy.nodes
      shell: |
        docker rm -f haproxy-{{ inventory_hostname }} 2>/dev/null || true
        docker run -itd --name haproxy-{{ inventory_hostname }} --network host \
          --entrypoint=bash \
          -v {{ etcd.certs_dir }}:/etc/pki/etcd/certs \
          {{ haproxy.image }}
      tags: haproxy

    - name: docker cp 脚本进独立 haproxy 容器并生成/启动（standalone 端口 {{ haproxy.port }}）
      when: mooncake.enabled and mooncake.ha.enable_ha and haproxy.mode == 'standalone' and inventory_hostname in haproxy.nodes
      shell: |
        docker exec haproxy-{{ inventory_hostname }} mkdir -p /home/ma-user/haproxy
        docker cp /tmp/gen_haproxy_etcd.sh haproxy-{{ inventory_hostname }}:/home/ma-user/haproxy/
        docker cp /tmp/start-ha.sh haproxy-{{ inventory_hostname }}:/home/ma-user/haproxy/
        docker exec haproxy-{{ inventory_hostname }} bash -c \
          'export HAP_LISTEN_START_PORT={{ haproxy.port }}; \
           export ETCD_SERVER_LIST="{{ etcd_server_list }}"; \
           bash /home/ma-user/haproxy/gen_haproxy_etcd.sh && \
           bash /home/ma-user/haproxy/start-ha.sh'
      tags: haproxy

    # mooncake 容器内 haproxy（CacheMaster，{{ haproxy.cache_master_port }}）
    - name: docker cp 脚本进 mooncake 容器并生成/启动 haproxy（CacheMaster {{ haproxy.cache_master_port }}）
      when: mooncake.enabled and mooncake.ha.enable_ha and haproxy.mode == 'per_container' and inventory_hostname in mooncake.ha.nodes
      shell: |
        docker exec mooncake-{{ inventory_hostname }} mkdir -p /home/ma-user/haproxy
        docker cp /tmp/gen_haproxy_etcd.sh mooncake-{{ inventory_hostname }}:/home/ma-user/haproxy/
        docker cp /tmp/start-ha.sh mooncake-{{ inventory_hostname }}:/home/ma-user/haproxy/
        docker exec mooncake-{{ inventory_hostname }} bash -c \
          'export HAP_LISTEN_START_PORT={{ haproxy.cache_master_port }}; \
           export ETCD_SERVER_LIST="{{ etcd_server_list }}"; \
           bash /home/ma-user/haproxy/gen_haproxy_etcd.sh && \
           bash /home/ma-user/haproxy/start-ha.sh'
      tags: haproxy

    # P/D 引擎容器内 haproxy（{{ haproxy.pd_port }}）
    - name: docker cp 脚本进 vllm-ascend 容器并生成/启动 haproxy（P/D 引擎 {{ haproxy.pd_port }}）
      when: mooncake.enabled and mooncake.ha.enable_ha and haproxy.mode == 'per_container'
      shell: |
        docker exec {{ container.name }} mkdir -p /home/ma-user/haproxy
        docker cp /tmp/gen_haproxy_etcd.sh {{ container.name }}:/home/ma-user/haproxy/
        docker cp /tmp/start-ha.sh {{ container.name }}:/home/ma-user/haproxy/
        docker exec {{ container.name }} bash -c \
          'export HAP_LISTEN_START_PORT={{ haproxy.pd_port }}; \
           export ETCD_SERVER_LIST="{{ etcd_server_list }}"; \
           bash /home/ma-user/haproxy/gen_haproxy_etcd.sh && \
           bash /home/ma-user/haproxy/start-ha.sh'
      tags: haproxy

    # mooncake_master：kvpool 才需要。HA 时在 haproxy 起完后启动（先 haproxy → 再 master），
    #   -enable_ha + -etcd_endpoints 指本机 CacheMaster haproxy（先起 master 会因 haproxy 未就绪连不上 etcd）；
    #   单主时直接启动（无 -enable_ha / -etcd_endpoints，master 直连，待实机确认）。
    - name: 容器内起 mooncake_master（HA：enable_ha+etcd 选主；单主：直连）
      when: mooncake.enabled and inventory_hostname in mooncake_master_nodes
      shell: |
        docker exec mooncake-{{ inventory_hostname }} mkdir -p {{ mooncake_log | dirname }} 2>/dev/null || true
        # glog 的 -log_dir 默认 /var/log/mooncake_master，镜像里没有该目录 ⇒ 会刷
        # "COULD NOT CREATE A LOGGINGFILE ... No such file or directory"。先建出来（幂等）。
        docker exec mooncake-{{ inventory_hostname }} mkdir -p {{ mooncake.ha.log_dir }} 2>/dev/null || true
        docker exec mooncake-{{ inventory_hostname }} pkill -x mooncake_master 2>/dev/null || true
        docker exec -d mooncake-{{ inventory_hostname }} bash -c \
          'mooncake_master {% if mooncake.ha.enable_ha %}-enable_ha=true \
            {% endif %}--cluster_id=mooncake \
            {% if mooncake.ha.enable_ha %}--etcd_endpoints="{{ master_etcd_endpoints }}" \
            {% endif %}--rpc-address {{ ip }} \
            -rpc_port={{ mooncake.ha.rpc_port }} \
            -metrics_port={{ mooncake.ha.metrics_port }} \
            -eviction_high_watermark_ratio={{ mooncake.evict }} \
            -eviction_ratio={{ mooncake.ha.eviction_ratio }} \
            -default_kv_lease_ttl={{ mooncake.default_kv_lease_ttl }} \
            -log_dir={{ mooncake.ha.log_dir }} \
            -max_log_size=1800 -stderrthreshold=4 -stop_logging_if_full_disk=true \
            >> {{ mooncake_log }} 2>&1'
        sleep 2 && docker exec mooncake-{{ inventory_hostname }} pgrep -x mooncake_master >/dev/null
      tags: mooncake

    # ==================== 第二阶段：引擎（任务 6，对照 deploy.sh start_engines） ====================
    # 核心：Jinja2 模板的 local_ip 用 inventory 静态 ip 字段（真实网卡 IP），
    #       启动参数用 set_fact 派生（Jinja2，N3 语义）。
    # 安全点：只渲染模板 + 起引擎，不实机跑（syntax-check 只验语法）。

    - name: 派生本节点角色/索引（Jinja2 表达式，N3 语义）
      set_fact:
        node_role: "{{ 'prefill' if inventory_hostname[0] == 'p' else 'decode' }}"
        node_idx: "{{ inventory_hostname[1:] | int }}"
        served_model_name: "{{ model_name }}"
        mooncake_config_path: "/root/pd/mooncake.json"
      tags: engine

    - name: 派生本节点启动参数（Jinja2 表达式，N3 语义）
      set_fact:
        dp_size: "{{ pd_cluster[node_role].dp_size }}"
        dp_size_local: "{{ pd_cluster[node_role].dp_size_local }}"
        tp_size: "{{ pd_cluster[node_role].tp_size }}"
        dp_rank: "{{ node_idx * pd_cluster[node_role].dp_size_local }}"
        dp_address: "{{ hostvars[groups[node_role][0]].ip }}"
        rpc_port: "{{ pd_cluster[node_role].rpc_port }}"
        start_port: "{{ pd_cluster[node_role].base_port }}"
        kv_port: "{{ pd_cluster[node_role].kv_port }}"
        max_model_len: "{{ pd_cluster.max_model_len }}"
        cluster_type: "{{ cluster_type }}"
        model_path: "{{ model_path }}"
        prefill_dp: "{{ pd_cluster.prefill.dp_size }}"
        prefill_tp: "{{ pd_cluster.prefill.tp_size }}"
        decode_dp: "{{ pd_cluster.decode.dp_size }}"
        decode_tp: "{{ pd_cluster.decode.tp_size }}"
      tags: engine

    - name: 计算 vllm 日志路径（logs.dir 为空回退 /root，{node} 按节点替换，对照 deploy.sh vllm_log）
      set_fact:
        vllm_log: "{{ (logs.dir | default('')) or '/root' }}/{{ logs.vllm | default('vllm_{node}.log') | replace('{node}', inventory_hostname) }}"
      tags: engine

    - name: 渲染 run_dp_template.sh（每节点，dest 为节点 /tmp，模板用 inventory ip 字段）
      template:
        src: "../templates/run_dp_{{ node_role }}_template.sh.j2"
        dest: "/tmp/run_dp_template_{{ inventory_hostname }}.sh"
      tags: engine

    - name: docker cp 模板进容器 /root/pd/run_dp_template.sh（对照 deploy.sh start_node）
      shell: docker cp /tmp/run_dp_template_{{ inventory_hostname }}.sh {{ container.name }}:/root/pd/run_dp_template.sh
      tags: engine

    # - name: 分发 patch
    #   copy:
    #     src: "../verify_req_phase1_v0.23.0.patch"
    #     dest: "/tmp/verify_req_phase1_v0.23.0.patch"
    #   tags: engine

    # - name: 打 patch
    #   shell: |
    #     docker cp /tmp/verify_req_phase1_v0.23.0.patch {{ container.name }}:/vllm-workspace/vllm-ascend/verify_req_phase1_v0.23.0.patch
    #     docker exec {{ container.name }} bash -c 'cd /vllm-workspace/vllm-ascend/ && git apply verify_req_phase1_v0.23.0.patch'
    #   tags: engine

    - name: 启动引擎（对照 deploy.sh start_engines，docker exec -d 后台）
      shell: |
        docker exec {{ container.name }} mkdir -p {{ vllm_log | dirname }} 2>/dev/null || true
        docker exec -d {{ container.name }} bash -c 'cd /root/pd && python3 launch_online_dp.py \
          --dp-size {{ dp_size }} --tp-size {{ tp_size }} --dp-size-local {{ dp_size_local }} \
          --dp-rank-start {{ dp_rank }} --dp-address {{ dp_address }} \
          --dp-rpc-port {{ rpc_port }} --vllm-start-port {{ start_port }} >> {{ vllm_log }} 2>&1'
      tags: engine

    # ==================== wait_ready（对照 deploy.sh cmd_start 的 wait_ready 段） ====================
    # 实例清单经 run_once 在控制端生成（Jinja2 生成 role ip port，跳过 proxy）；
    # retries 由 runtime.ready_timeout 折算（2400s / 15s = 160）
    - name: 生成实例清单（run_once，Jinja2 生成）
      run_once: true
      set_fact:
        instance_list: |-
          {% set il = [] -%}
          {% for role in ['prefill', 'decode'] -%}
          {# non_master_headless（v0.30 口径）：该 role 只有首节点有 API server，其余 --headless 不进探测清单 #}
          {% set ns = groups[role][:1] if (pd_cluster[role].non_master_headless | default(false)) else groups[role] -%}
          {% for h, r in ns | product(range(pd_cluster[role].dp_size_local)) -%}
          {% set _ = il.append([role, hostvars[h].ip, pd_cluster[role].base_port + r]) -%}
          {% endfor -%}
          {% endfor -%}
          {% set _ = il.append(['proxy', hostvars[groups['proxy'][0]].ip, proxy.port]) -%}
          {{ il }}
      tags: wait

    - name: 等待全部实例就绪（uri + until，遍历实例清单）
      run_once: true
      uri:
        url: "http://{{ item[1] }}:{{ item[2] }}/health"
        status_code: 200
        timeout: 5
      register: result
      until: result.status == 200
      retries: "{{ (runtime.ready_timeout | default(2400)) | int // 15 }}"
      delay: 15
      loop: "{{ instance_list }}"
      when: item[0] != 'proxy'
      tags: wait

    # ==================== proxy + 冒烟（任务 7，对照 deploy.sh start_proxy + wait_ready proxy + smoke_test） ====================
    # 端点来源：Jinja2 生成（N4 PROXY_ENDPOINTS 表达式）。
    #   多值字段（prefiller_hosts 等）在表达式内 join(' ') 成空格分隔，与 deploy.sh proxy_args 里
    #   '$PREFILLER_HOSTS' 展开效果一致（proxy 脚本 nargs='+' 接收）。
    # 安全点：容器 --pid=host，pkill 锚定 '^python3 .*load_balance_proxy_server_example'，
    #   避免误杀控制机 ssh 会话（其 cmdline 以 ssh 开头，不匹配）。

    - name: 校验 proxy 白名单节点名（proxy.prefill_nodes/decode_nodes 只能填对应组节点名，非法 fail-fast）
      run_once: true
      assert:
        that:
          - proxy.prefill_nodes | default([]) | difference(groups['prefill']) | length == 0
          - proxy.decode_nodes | default([]) | difference(groups['decode']) | length == 0
        fail_msg: >-
          proxy.prefill_nodes/decode_nodes 含 inventory 中不存在的节点名：
          {{ (proxy.prefill_nodes | default([])) | difference(groups['prefill']) | join(' ') }}
          {{ (proxy.decode_nodes | default([])) | difference(groups['decode']) | join(' ') }}
      tags: proxy

    - name: 生成 proxy 端点（Jinja2 生成；run_once 于 p0 并回收 facts；白名单解析见 vars pn/dn）
      run_once: true
      delegate_to: p0
      delegate_facts: yes
      vars:
        # 接入白名单（group_vars proxy.prefill_nodes/decode_nodes）：undefined 或空列表都回退全量
        # （default(x, true) 对 falsy 也生效）。放 vars: 而非 set_fact 键——同任务模板先整体
        # 渲染再执行，键间不能引用；故下面两个表达式各自自包含（不引用其它 vars: 键）。
        # non_master_headless（v0.30 口径）：该 role 只有首节点有 API server，
        # 其余节点 --headless 不对外服务 → proxy 端点只取首节点（此时白名单对该 role 不再生效）
        pn: "{{ [groups['prefill'][0]] if (pd_cluster.prefill.non_master_headless | default(false)) else (proxy.prefill_nodes | default(groups['prefill'], true)) }}"
        dn: "{{ [groups['decode'][0]] if (pd_cluster.decode.non_master_headless | default(false)) else (proxy.decode_nodes | default(groups['decode'], true)) }}"
      set_fact:
        proxy_host: "{{ hostvars[groups['proxy'][0]].ip }}"
        proxy_port: "{{ proxy.port | string }}"
        prefiller_hosts: "{% set out = [] -%}{% for h, r in pn | product(range(pd_cluster.prefill.dp_size_local)) -%}{% set _ = out.append(hostvars[h].ip) -%}{% endfor -%}{{ out | join(' ') }}"
        prefiller_ports: "{% set out = [] -%}{% for h, r in pn | product(range(pd_cluster.prefill.dp_size_local)) -%}{% set _ = out.append((pd_cluster.prefill.base_port + r) | string) -%}{% endfor -%}{{ out | join(' ') }}"
        decoder_hosts: "{% set out = [] -%}{% for h, r in dn | product(range(pd_cluster.decode.dp_size_local)) -%}{% set _ = out.append(hostvars[h].ip) -%}{% endfor -%}{{ out | join(' ') }}"
        decoder_ports: "{% set out = [] -%}{% for h, r in dn | product(range(pd_cluster.decode.dp_size_local)) -%}{% set _ = out.append((pd_cluster.decode.base_port + r) | string) -%}{% endfor -%}{{ out | join(' ') }}"
      tags: proxy

    - name: 计算 proxy 日志路径（logs.dir 为空回退 /root，对照 deploy.sh PROXY_LOG）
      set_fact:
        proxy_log: "{{ (logs.dir | default('')) or '/root' }}/{{ logs.proxy | default('proxy.log') }}"
      tags: proxy

    - name: 分发 proxy 脚本到节点 /tmp（对照 deploy.sh 的 scpn；layerwise 档脚本在镜像里，不落盘）
      copy:
        src: "../{{ proxy.script }}"
        dest: "/tmp/{{ proxy.script }}"
      when: inventory_hostname == 'p0' and not (proxy.layerwise | default(false) | bool)
      tags: proxy

    - name: docker cp proxy 脚本进容器（仅 plain 档；layerwise 档脚本镜像自带，无需 cp）
      when: inventory_hostname == 'p0' and not (proxy.layerwise | default(false) | bool)
      shell: |
        docker exec {{ container.name }} mkdir -p /root/pd 2>/dev/null || true
        docker cp /tmp/{{ proxy.script }} {{ container.name }}:/root/pd/
        docker exec {{ container.name }} chmod +x /root/pd/{{ proxy.script }}
      tags: proxy

    - name: 启动 proxy（对照 deploy.sh start_proxy，pkill 锚定 ^python3）
      when: inventory_hostname == 'p0'
      vars:
        # layerwise（P/D remote-D2H offload）：直接跑镜像示例目录里的脚本；
        #   plain：跑上面 docker cp 进 /root/pd 的那份
        proxy_script_path: "{{ (proxy.layerwise | default(false) | bool) | ternary(proxy.layerwise_image_dir ~ '/' ~ proxy.script, '/root/pd/' ~ proxy.script) }}"
        # layerwise 脚本禁止 --host 0.0.0.0（decode 要按 host:port 回调 proxy 的 /v1/metaserver），
        #   故绑定 proxy 节点真实 IP；plain 档保持原来的 0.0.0.0
        proxy_bind: "{{ (proxy.layerwise | default(false) | bool) | ternary(proxy_host, '0.0.0.0') }}"
      shell: |
        docker exec {{ container.name }} pkill -f '^python3 .*{{ proxy.script }}' 2>/dev/null || true
        docker exec -d {{ container.name }} bash -c 'unset http_proxy https_proxy; python3 {{ proxy_script_path }} \
          --host {{ proxy_bind }} --port {{ proxy_port }} \
          --prefiller-hosts {{ prefiller_hosts }} --prefiller-ports {{ prefiller_ports }} \
          --decoder-hosts {{ decoder_hosts }} --decoder-ports {{ decoder_ports }} >> {{ proxy_log }} 2>&1'
      tags: proxy

    - name: 等待 proxy /healthcheck 就绪（uri + until，对照 deploy.sh wait_ready "proxy"）
      when: inventory_hostname == 'p0'
      uri:
        url: "http://{{ proxy_host }}:{{ proxy_port }}/healthcheck"
        status_code: 200
        timeout: 5
      register: proxy_health
      until: proxy_health.status == 200
      retries: "{{ (runtime.proxy_ready_timeout | default(600)) | int // 15 }}"
      delay: 15
      tags: proxy

    - name: 冒烟测试（control 端 POST /v1/chat/completions，对照 deploy.sh smoke_test）
      when: inventory_hostname == 'p0'
      ansible.builtin.uri:
        url: "http://{{ proxy_host }}:{{ proxy_port }}/v1/chat/completions"
        method: POST
        headers:
          Content-Type: "application/json"
          # Authorization: "Bearer {{ api_key | default('EMPTY') }}"
        body:
          model: "{{ served_model_name }}"
          messages:
            - role: user
              content: "你好，介绍一下你自己."
          max_completion_tokens: 1024
          temperature: 0.7
        body_format: json
        status_code: 200
      register: smoke
      until: smoke.status == 200
      retries: 10
      delay: 5
      tags: smoke
