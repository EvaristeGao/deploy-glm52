---
# deploy-glm52 status playbook（只读：容器状态 + 引擎/proxy 健康探测）
# 对照 deploy.sh cmd_status()。不起任何服务、不占卡，可随时实机运行。
# 连接参数统一在 inventories/<集群>/group_vars/all.yml（inventory 自动加载）
#
# 用法：
#   ansible-playbook -i ansible/inventory.yaml ansible/playbooks/status.yml
#   ansible-playbook -i ansible/inventory.yaml ansible/playbooks/status.yml -l p0   # 只查 p0
#
# 引擎健康端口：由节点参数派生（Jinja2）。start_port = pd_cluster[node_role].base_port
#   （语义与既有 VLLM_START_PORT = base_port 一致）。
#   当前集群停止时容器不存在 → inspect 报 no-container，engine/proxy uri 非 200 由 ignore_errors 兜底。
- name: deploy-glm52 实例探测
  hosts: all
  gather_facts: no
  tasks:
    # 对照 deploy.sh cmd_status(): docker inspect -f '{{.State.Status}}' || echo no-container
    - name: 容器状态
      shell: docker inspect -f '{{ '{{' }}.State.Status{{ '}}' }}' {{ container.name }} 2>/dev/null || echo no-container
      register: cst
      changed_when: false   # 只读探测

    # 对照 deploy.sh cmd_status(): 引擎 /health（start_port = pd_cluster[node_role].base_port）
    # 派生分两步（同 set_fact 内 key 相互不可见，start.yml 同款模式）
    - name: 派生本节点角色（Jinja2）
      set_fact:
        node_role: "{{ 'prefill' if inventory_hostname[0] == 'p' else 'decode' }}"
      changed_when: false

    - name: 派生引擎起始端口（= pd_cluster[node_role].base_port）
      set_fact:
        start_port: "{{ pd_cluster[node_role].base_port }}"
      changed_when: false

    - name: 引擎健康（uri /health；集群停止时非 200 由 ignore_errors 兜底）
      uri:
        url: "http://{{ ansible_host }}:{{ start_port }}/health"
        status_code: 200
        timeout: 5
      ignore_errors: yes
      register: engine_health
      changed_when: false   # 只读探测

    # 对照 deploy.sh cmd_status(): proxy /healthcheck（proxy 节点 = inventory proxy 组首成员）
    - name: proxy 健康（proxy 节点 /healthcheck）
      when: inventory_hostname == groups['proxy'][0]
      uri:
        url: "http://{{ ansible_host }}:{{ proxy.port }}/healthcheck"
        status_code: 200
        timeout: 5
      ignore_errors: yes
      register: proxy_health
      changed_when: false   # 只读探测