---
# deploy-glm52 status playbook（只读：容器状态 + 引擎/proxy 健康探测）
# 对照 deploy.sh cmd_status()。不起任何服务、不占卡，可随时实机运行。
# 连接参数统一在 group_vars/all.yml（来源：config.yaml 的 ssh 段）
#
# 用法：
#   ansible-playbook -i ansible/inventory.yaml ansible/playbooks/status.yml
#   ansible-playbook -i ansible/inventory.yaml ansible/playbooks/status.yml -l p0   # 只查 p0
#
# 引擎健康端口：resolve_node filter 复用 resolve_node.py 的 VLLM_START_PORT（按节点计算）。
#   当前集群停止时容器不存在 → inspect 报 no-container，engine/proxy uri 非 200 由 ignore_errors 兜底。
- name: deploy-glm52 实例探测
  hosts: all
  gather_facts: no
  tasks:
    - name: 加载 config 变量（container.name 等顶层字段）
      include_vars: "../../config.yaml"

    - name: 读取 config 全量 dict（供 resolve_node filter / proxy 端点）
      set_fact:
        cfg: "{{ lookup('file', playbook_dir + '/../../config.yaml') | from_yaml }}"

    # 对照 deploy.sh cmd_status(): docker inspect -f '{{.State.Status}}' || echo no-container
    - name: 容器状态
      shell: docker inspect -f '{{ '{{' }}.State.Status{{ '}}' }}' {{ container.name }} 2>/dev/null || echo no-container
      register: cst

    # 对照 deploy.sh cmd_status(): 引擎 /health（resolve_node 的 VLLM_START_PORT）
    - name: resolve_node 计算本节点引擎端口
      set_fact:
        node_cfg: "{{ cfg | resolve_node(inventory_hostname) }}"

    - name: 引擎健康（uri /health；集群停止时非 200 由 ignore_errors 兜底）
      uri:
        url: "http://{{ ansible_host }}:{{ node_cfg['VLLM_START_PORT'] }}/health"
        status_code: 200
        timeout: 5
      ignore_errors: yes
      register: engine_health

    # 对照 deploy.sh cmd_status(): proxy /healthcheck（proxy 节点）
    - name: proxy 健康（proxy 节点 /healthcheck）
      when: inventory_hostname == cfg['proxy']['node']
      uri:
        url: "http://{{ ansible_host }}:{{ cfg['proxy']['port'] }}/healthcheck"
        status_code: 200
        timeout: 5
      ignore_errors: yes
      register: proxy_health