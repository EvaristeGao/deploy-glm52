# deploy-glm52 — Ansible 配置
# 唯一必要项：让各 playbook（ansible/playbooks/）能发现自定义 filter 插件。
#   Ansible core 2.21 的 filter 自动发现只查 playbook 同级 filter_plugins/
#   （ansible/playbooks/filter_plugins），不会向上找 ansible/filter_plugins，
#   因此显式声明插件目录（相对仓库根，配合文档里的 repo-root 运行方式）。
[defaults]
filter_plugins = ansible/filter_plugins